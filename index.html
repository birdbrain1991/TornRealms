<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KAIJU SKIRMISH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.162.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.162.0/examples/jsm/"
}}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Soviet military palette */
  --bg:#1a1a14;        /* deep olive-black background */
  --p:#252418;         /* canvas/panel olive */
  --p2:#2d2c1f;        /* lighter olive panel */
  --b:#3a3826;         /* faded olive border */
  --bh:#5a5538;        /* highlighted brass-olive */
  --t:#c8c0a0;         /* off-white parchment text */
  --th:#f0e8c8;        /* bright off-white */
  --dm:#7a7250;        /* dim olive text */
  --cy:#6a8a3a;        /* military green (was cyan) */
  --rd:#c83020;        /* soviet red (was red) */
  --gr:#8aa83a;        /* khaki-green (was green) */
  --yl:#d8a838;        /* dirty gold */
  --pu:#a86038;        /* rust brown (was purple) */
  --fh:'Orbitron',monospace;
  --fm:'Share Tech Mono',monospace;
  --fb:'Exo 2',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t);font-family:var(--fb);overflow:hidden}
/* Stencil-style accents for headings */
.logo{font-family:var(--fh);font-stretch:condensed}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(106,138,58,.015) 3px,rgba(106,138,58,.015) 4px)}
.S{display:none;position:fixed;inset:0;flex-direction:column;overflow:hidden}.S.on{display:flex}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--p)}
.logo{font-family:var(--fh);font-weight:900;font-size:.8rem;letter-spacing:.18em;color:var(--th);text-shadow:0 0 6px rgba(200,48,32,.4)}
.ti{font-family:var(--fm);font-size:.55rem;color:var(--dm);letter-spacing:.1em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rd);box-shadow:0 0 6px var(--rd);animation:bl 1.8s infinite}
.dot.ok{background:var(--gr);box-shadow:0 0 6px var(--gr);animation:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}

.btn{font-family:var(--fh);font-size:.6rem;letter-spacing:.08em;padding:10px 18px;cursor:pointer;
  border:1px solid var(--bh);background:transparent;color:var(--th);transition:all .14s;
  }
.btn:hover{border-color:var(--rd);color:var(--rd);background:rgba(200,48,32,.06)}.btn:active{transform:scale(.97)}
.btn.c{border-color:var(--cy);color:var(--cy)}.btn.g{border-color:var(--gr);color:var(--gr)}
.btn.r{border-color:var(--rd);color:var(--rd)}.btn.gh{border-color:var(--b);color:var(--dm)}

.inp{font-family:var(--fm);font-size:.9rem;letter-spacing:.14em;padding:10px 12px;
  background:var(--p2);border:1px solid var(--bh);color:var(--th);outline:none;width:100%}
.inp:focus{border-color:var(--cy)}
.lb{font-family:var(--fh);font-size:.44rem;letter-spacing:.18em;color:var(--dm);margin-bottom:4px}

.hpt{height:6px;background:var(--p2);border:1px solid var(--b)}
.hpf{height:100%;background:var(--gr);transition:width .35s,background .35s}
.hpf.w{background:var(--yl)}.hpf.cr{background:var(--rd)}
.hptx{font-family:var(--fm);font-size:.52rem;color:var(--dm);text-align:right;margin-top:2px}

.chip{font-family:var(--fm);font-size:.44rem;padding:1px 4px;border:1px solid var(--dm);color:var(--dm);display:inline-block;margin:1px}
.chip.bad{border-color:var(--rd);color:var(--rd)}.chip.good{border-color:var(--gr);color:var(--gr)}

.sl{font-family:var(--fh);font-size:.43rem;letter-spacing:.18em;color:var(--dm);padding-bottom:4px;border-bottom:1px solid var(--b);margin-bottom:7px}
.log{flex:1;min-height:0;overflow-y:auto;padding:5px 8px;font-family:var(--fm);font-size:.6rem;line-height:1.7}
.lr{display:flex;gap:5px}.lr .ts{color:var(--dm);flex-shrink:0}
.lr.sys .m{color:var(--th)}.lr.dmg .m{color:var(--rd);font-weight:bold}.lr.roll .m{color:var(--yl)}.lr.phase .m{color:var(--gr);font-weight:bold;letter-spacing:.06em}

.dc{width:52px;height:52px;border:2px solid var(--bh);background:var(--p2);color:var(--th);
  font-family:var(--fh);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.dc:hover{border-color:var(--yl);color:var(--yl)}.dc.used{border-color:var(--dm);color:var(--dm);pointer-events:none}
.dc.shake{animation:dsh .4s ease}
@keyframes dsh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.br{font-family:var(--fh);font-weight:900;font-size:2.2rem;text-align:center;color:var(--yl);text-shadow:0 0 10px rgba(216,168,56,.6);min-height:2.6rem}
.br.crit{color:var(--gr);text-shadow:0 0 10px rgba(138,168,58,.7)}.br.fumb{color:var(--rd);text-shadow:0 0 10px rgba(200,48,32,.7)}

.ec{padding:8px 10px;border:1px solid var(--b);background:var(--p2);position:relative;margin-bottom:5px}
.ec.mine{border-color:var(--gr);background:rgba(106,138,58,.04)}.ec.kai{border-color:rgba(200,48,32,.5);background:rgba(200,48,32,.04)}
.ec.turn::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rd),transparent)}
.ec.kai.turn::before{background:linear-gradient(90deg,transparent,var(--rd),transparent)}
.en{font-family:var(--fh);font-size:.68rem;letter-spacing:.1em;color:var(--th);margin-bottom:2px}
.et{font-family:var(--fm);font-size:.56rem;color:var(--dm);margin-bottom:4px}

.pb{display:flex;gap:3px;padding:4px 10px;border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.ps{font-family:var(--fh);font-size:.46rem;letter-spacing:.06em;padding:4px 10px;border:1px solid var(--b);color:var(--dm);white-space:nowrap;flex-shrink:0;
  }
.ps.dn{border-color:var(--bh);color:var(--bh)}.ps.ac{border-color:var(--rd);color:var(--th);background:rgba(200,48,32,.12)}

.tb{text-align:center;padding:5px;font-family:var(--fh);font-size:.53rem;letter-spacing:.1em;border-bottom:1px solid var(--b);flex-shrink:0}
.tb.my{color:var(--th);background:rgba(106,138,58,.12);border-bottom:2px solid var(--gr)}.tb.wt{color:var(--dm)}.tb.mk{color:var(--th);background:rgba(200,48,32,.15);border-bottom:2px solid var(--rd)}

.modal{display:none;position:fixed;inset:0;background:rgba(4,6,10,.88);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mx{width:min(360px,92vw);background:var(--p);border:1px solid var(--bh);padding:18px}
.mt{font-family:var(--fh);font-size:.68rem;letter-spacing:.15em;color:var(--th);margin-bottom:12px;border-bottom:1px solid var(--b);padding-bottom:6px}

.wo{padding:10px 12px;border:1px solid var(--b);cursor:pointer;transition:all .14s;display:flex;gap:10px;align-items:center;margin-bottom:5px}
.wo:hover{border-color:var(--bh);background:rgba(106,138,58,.05)}.wo.sel{border-color:var(--gr);background:rgba(106,138,58,.1)}
.wn{font-family:var(--fh);font-size:.62rem;letter-spacing:.07em;color:var(--th)}
.ws{font-family:var(--fm);font-size:.56rem;color:var(--dm)}
.wbd{font-family:var(--fm);font-size:.42rem;padding:1px 4px;border:1px solid var(--bh);color:var(--dm);flex-shrink:0}

.ab{padding:10px 12px;border:1px solid var(--b);background:transparent;color:var(--t);font-family:var(--fm);font-size:.62rem;
  cursor:pointer;width:100%;text-align:left;margin-bottom:3px;transition:all .14s}
.ab:hover{border-color:var(--rd);color:var(--rd)}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bh)}

/* ══ SCREENS ══ */
#SL{background:radial-gradient(ellipse 70% 50% at 50% 110%,rgba(200,48,32,.05),transparent),var(--bg);
  align-items:center;justify-content:center;overflow-y:auto}
.lw{width:min(390px,92vw);display:flex;flex-direction:column;gap:13px;padding:20px 0}
.lh h1{font-family:var(--fh);font-weight:900;font-size:clamp(1.8rem,7vw,2.7rem);letter-spacing:.25em;
  color:var(--th);text-shadow:0 0 4px rgba(200,48,32,.5),2px 2px 0 rgba(200,48,32,.3);line-height:1.1;text-align:center}
.lh p{font-family:var(--fm);font-size:.54rem;letter-spacing:.25em;color:var(--rd);margin-top:5px;text-align:center}
.dv{height:1px;background:linear-gradient(90deg,transparent,var(--bh),transparent)}
.lp{padding:16px;border:1px solid var(--bh);background:var(--p);display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 20px rgba(0,0,0,.4)}
.err{font-family:var(--fm);font-size:.52rem;color:var(--rd);min-height:1em}
.hn{font-family:var(--fm);font-size:.52rem;color:var(--dm);line-height:1.8;text-align:center}
.cs{font-family:var(--fm);font-size:.6rem;color:var(--t);text-align:center;min-height:1.5em;letter-spacing:.08em}

#SR{background:var(--bg)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:9px;flex:1;min-height:0;overflow-y:auto}
.rc{border:1px solid var(--b);background:var(--p2);padding:10px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:4px}
.rc:hover{border-color:var(--bh);background:rgba(106,138,58,.04)}.rc.sel{border-color:var(--gr);background:rgba(106,138,58,.12);box-shadow:0 0 8px rgba(106,138,58,.2)}
.rc.kc{border-color:rgba(200,48,32,.4)}.rc.kc.sel{border-color:var(--rd);background:rgba(200,48,32,.12);box-shadow:0 0 8px rgba(200,48,32,.2)}
.rc.taken{opacity:.3;pointer-events:none}
.rn{font-family:var(--fh);font-size:.58rem;letter-spacing:.1em;color:var(--th)}
.rd{font-size:.54rem;color:var(--dm);line-height:1.4}
.rf{flex-shrink:0;padding:9px 13px;border-top:1px solid var(--b);background:var(--p);display:flex;align-items:center;justify-content:space-between;gap:9px}

#SC{background:var(--bg)}
.cb{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(280px,2fr) minmax(220px,1.4fr) minmax(220px,1fr);
  grid-template-rows:1fr;overflow:hidden}
.cb-3d{position:relative;overflow:hidden;background:#1a1a14;border-right:1px solid var(--b)}
.cb-3d canvas{display:block;width:100%;height:100%}
.cb-3d-overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;
  background:linear-gradient(transparent,rgba(26,26,20,.92));pointer-events:none;
  font-family:var(--fm);font-size:.54rem;color:var(--dm);display:flex;flex-wrap:wrap;gap:6px}
.cb-3d-overlay .dist-tag{color:var(--yl);pointer-events:auto;cursor:default}

/* Middle column: action / turn sequence */
.cb-mid{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--b);background:var(--p)}
.cb-mid-head{flex-shrink:0;padding:5px 9px;border-bottom:1px solid var(--b);background:var(--p2)}

/* Right column: units + log */
.cb-side{display:flex;flex-direction:column;overflow:hidden}
.cb-ents{flex-shrink:0;max-height:42vh;overflow-y:auto;padding:5px;border-bottom:1px solid var(--b)}
.cbt{padding:8px;overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:7px}
.cbb{display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:120px}
.cbbh{flex-shrink:0;padding:3px 7px;border-bottom:1px solid var(--b)}

/* Tablet: stack vertically when narrow */
@media(max-width:900px){
  .cb{grid-template-columns:1fr 1fr;grid-template-rows:38vh 1fr}
  .cb-3d{grid-column:1/3;grid-row:1;border-right:none;border-bottom:1px solid var(--b)}
  .cb-mid{grid-column:1;grid-row:2}
  .cb-side{grid-column:2;grid-row:2}
}
@media(max-width:560px){
  .cb{grid-template-columns:1fr;grid-template-rows:32vh auto 1fr}
  .cb-3d{grid-column:1;grid-row:1}
  .cb-mid{grid-column:1;grid-row:2;border-right:none;border-bottom:1px solid var(--b);max-height:50vh}
  .cb-side{grid-column:1;grid-row:3}
  .cb-ents{max-height:30vh}
}

/* Init tracker */
.it{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.itc{padding:6px 10px;border:1px solid var(--b);background:var(--p2);font-family:var(--fm);font-size:.58rem;color:var(--dm);min-width:100px;transition:all .2s}
.itc.done{border-color:var(--gr);color:var(--gr)}.itc.wait{border-color:var(--yl);color:var(--yl)}
.itc .iv{font-family:var(--fh);font-size:1rem;font-weight:700;margin-top:3px}

/* Color swatches */
.color-picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:5px;padding:4px}
.color-swatch{height:36px;border:2px solid var(--b);cursor:pointer;transition:all .15s;border-radius:2px}
.color-swatch:hover{border-color:var(--bh);transform:scale(1.08)}
.color-swatch.sel{border-color:var(--rd);box-shadow:0 0 6px rgba(200,48,32,.5)}

/* Movement compass */
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px;border:1px solid var(--b);background:var(--p2)}
.compass-btn{padding:13px 6px;background:var(--p);border:1px solid var(--bh);color:var(--th);
  font-family:var(--fh);font-size:.7rem;letter-spacing:.08em;cursor:pointer;transition:all .14s}
.compass-btn:hover{border-color:var(--gr);color:var(--gr);background:rgba(106,138,58,.1)}
.compass-btn:active{transform:scale(.95)}
.compass-btn.dim{opacity:.3;cursor:not-allowed;pointer-events:none}
.compass-center{padding:13px 6px;background:var(--p);border:1px dashed var(--b);
  color:var(--dm);font-family:var(--fh);font-size:1.2rem;cursor:default}

/* Mecha selector dropdown */
.msel{width:100%;padding:10px 12px;background:var(--p2);border:1px solid var(--bh);color:var(--th);
  font-family:var(--fm);font-size:.8rem;letter-spacing:.1em;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--rd) 50%),linear-gradient(135deg,var(--rd) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.msel:focus{border-color:var(--rd)}
.msel option{background:var(--p2);color:var(--th);padding:6px}

.mloadout{margin-top:8px;padding:9px;border:1px solid var(--b);background:var(--p2)}
.slotrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--b);font-family:var(--fm);font-size:.62rem}
.slotrow:last-child{border-bottom:none}
.slotbadge{font-family:var(--fh);font-size:.46rem;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--bh);color:var(--dm);min-width:56px;text-align:center;flex-shrink:0}
.slotbadge.def{border-color:var(--gr);color:var(--gr)}
.slotname{color:var(--th);flex:1}
.slotempty{color:var(--dm);font-style:italic}

.statrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-family:var(--fm);font-size:.62rem}
.statlbl{color:var(--th);min-width:90px;flex-shrink:0}
.statdots{display:flex;gap:3px}
.dot-stat{width:9px;height:9px;border-radius:50%;border:1px solid var(--bh)}
.dot-stat.f{background:var(--rd);border-color:var(--rd);box-shadow:0 0 3px rgba(200,48,32,.5)}

/* Turn order bar */
.tob{display:flex;gap:4px;padding:4px 10px;border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tos{font-family:var(--fm);font-size:.54rem;padding:4px 10px;border:1px solid var(--b);color:var(--dm);white-space:nowrap}
.tos.active{border-color:var(--gr);color:var(--th);background:rgba(106,138,58,.12);font-weight:bold}
.tos.kai-active{border-color:var(--rd);color:var(--rd);background:rgba(240,48,64,.06)}
.tos.done{color:var(--bh);border-color:var(--bh)}
</style>
</head>
<body>

<div id="SL" class="S on">
  <div class="lw">
    <div class="lh"><h1>TORN<br>REALMS</h1><p>KAIJU SKIRMISH · v0.5</p></div>
    <div class="dv"></div>
    <div class="lp">
      <div><div class="lb">RAUM-CODE (4+ Zeichen)</div>
        <input class="inp" id="lc" maxlength="8" placeholder="Z.B.  ALPHA1" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="err" id="le"></div>
      <div class="cs" id="cs"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
        <button class="btn c" onclick="doHost()">+ HOSTEN</button>
        <button class="btn" onclick="doJoin()">→ BEITRETEN</button>
      </div>
    </div>
    <p class="hn">Host erstellt Raum. Gäste treten mit Code bei.<br>Funktioniert über WLAN zwischen Geräten.</p>
  </div>
</div>

<div id="SR" class="S">
  <div class="top">
    <span class="logo" style="font-size:.68rem">KAIJU SKIRMISH</span>
    <span class="ti" id="rr">RAUM: ——</span>
    <div style="display:flex;align-items:center;gap:7px"><div class="dot ok" id="rdot"></div><span class="ti" id="rcn">0</span></div>
  </div>
  <div style="padding:6px 10px 2px;flex-shrink:0"><div class="sl" style="margin:0">ROLLE WÄHLEN</div></div>
  <div class="rg" id="rg"></div>
  <div class="rf">
    <button class="btn r" onclick="doLeave()" style="padding:6px 11px">← ZURÜCK</button>
    <span class="err" id="re" style="flex:1"></span>
    <button class="btn gh" id="brdy" onclick="doReady()">BEREIT →</button>
  </div>
</div>

<div id="SC" class="S">
  <div class="top">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="logo" id="cn" style="font-size:.68rem">—</span>
      <span class="ti" id="cu">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <div class="dot ok"></div>
      <span class="ti" id="cr">RUNDE 1</span>
      <button class="btn" style="padding:3px 7px;font-size:.44rem" onclick="openM('mm')">☰</button>
    </div>
  </div>
  <div class="tb wt" id="tbn">—</div>
  <div class="tob" id="tob"></div>
  <div class="pb" id="ppb"></div>
  <div class="cb">
    <div class="cb-3d" id="viewport3d">
      <div class="cb-3d-overlay" id="dist-overlay"></div>
    </div>
    <div class="cb-mid">
      <div class="cb-mid-head"><div class="sl" style="margin:0">AKTION · ZUG-SEQUENZ</div></div>
      <div class="cbt" id="ca"></div>
    </div>
    <div class="cb-side">
      <div class="cb-ents">
        <div style="padding:3px 5px;border-bottom:1px solid var(--b)"><div class="sl" style="margin:0">EINHEITEN</div></div>
        <div id="el" style="padding:4px"></div>
      </div>
      <div class="cbb">
        <div class="cbbh"><div class="sl" style="margin:0">KAMPFLOG</div></div>
        <div class="log" id="cl"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="mm"><div class="mx"><div class="mt">MENÜ</div>
  <div style="display:flex;flex-direction:column;gap:7px">
    <button class="btn c" style="width:100%" onclick="closeM('mm')">FORTSETZEN</button>
    <button class="btn r" style="width:100%" onclick="doLeave()">VERLASSEN</button>
  </div></div></div>

<div class="modal" id="md"><div class="mx"><div class="mt">SCHADEN ANWENDEN</div>
  <div class="ti" id="mdt" style="margin-bottom:6px;color:var(--t)">Ziel: —</div>
  <div style="text-align:center;margin:10px 0">
    <div class="lb" style="text-align:center">GEWÜRFELTER SCHADEN</div>
    <div id="mdroll" style="font-family:var(--fh);font-weight:900;font-size:2rem;color:var(--yl);text-shadow:0 0 14px rgba(240,192,0,.4);margin:4px 0">0</div>
    <div id="mdarm" style="font-family:var(--fm);font-size:.56rem;color:var(--dm);margin-bottom:4px"></div>
    <div id="mdfinal" style="font-family:var(--fh);font-size:1rem;color:var(--rd)"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
    <button class="btn r" style="padding:12px 16px" onclick="doDmg()">ANWENDEN</button>

/*
  GAME STATE (G) — authoritative on host, synced to all
  
  G.state: 'LOBBY' | 'INIT_ROLL' | 'TURNS' | 'ROUND_END'
  G.round: current round number
  G.roles: { roleId: peerId }
  G.ents:  { roleId: entity }
  G.log:   [ {type, msg, ts} ]
  
  Initiative phase:
  G.initRolls: { roleId: number|null }  — null = hasn't rolled yet
  G.turnOrder: [ roleId, roleId, ... ]  — sorted by init desc
  G.turnIdx:   index into turnOrder for whose turn it is
  
  Active turn:
  G.turnPhase: 'WAFFE'|'ZIEL'|'ANGRIFF'|'SCHADEN'|'DONE'
*/

let G={state:'LOBBY',round:1,roles:{},ents:{},log:[],
  initRolls:{},turnOrder:[],turnIdx:0,turnPhase:'WAFFE'};
// Expose G to module scope via window — updated on every reassignment
Object.defineProperty(window,'G',{get(){return G;},set(v){G=v;}});

// ── PEERJS ────────────────────────────────────────────────────
let peer=null, conns=[];

function stat(t,ok){const e=document.getElementById('cs');if(e){e.textContent=t;e.style.color=ok?'var(--gr)':'var(--dm)';}}

function doHost(){
  const code=document.getElementById('lc').value.trim().toUpperCase();
  const err=document.getElementById('le');
  if(code.length<4){err.textContent='Min. 4 Zeichen.';return;}
  err.textContent='';ME.room=code;ME.isHost=true;
  G={state:'LOBBY',round:1,roles:{},ents:{},log:[],initRolls:{},turnOrder:[],turnIdx:0,turnPhase:'WAFFE'};
  stat('Verbinde…');
  peer=new Peer('ks_'+code,{debug:0});
  peer.on('open',()=>{stat('Raum aktiv: '+code,true);peer.on('connection',c=>hAccept(c));goRoles();});
  peer.on('error',e=>{
    if(e.type==='unavailable-id')err.textContent='Code belegt.';
    else err.textContent='Fehler: '+e.type;
    if(peer){peer.destroy();peer=null;}
  });
}

function doJoin(){
  const code=document.getElementById('lc').value.trim().toUpperCase();
  const err=document.getElementById('le');
  if(code.length<4){err.textContent='Min. 4 Zeichen.';return;}
  err.textContent='';ME.room=code;ME.isHost=false;
  stat('Verbinde…');
  peer=new Peer(undefined,{debug:0});
  peer.on('open',()=>{
    const c=peer.connect('ks_'+code,{reliable:true});
    c.on('open',()=>{conns=[c];stat('Verbunden: '+code,true);goRoles();});
    c.on('data',d=>gRecv(d));
    c.on('close',()=>{stat('Verbindung verloren.');conns=[];});
    c.on('error',e=>err.textContent='Fehler: '+e);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable')err.textContent='Raum "'+code+'" nicht gefunden.';
    else err.textContent='Fehler: '+e.type;
    if(peer){peer.destroy();peer=null;}
  });
}

function hAccept(c){
  conns.push(c);
  c.on('open',()=>{c.send({t:'FULL',G});updCnt();});
  c.on('data',d=>hRecv(d,c));
  c.on('close',()=>{conns=conns.filter(x=>x!==c);updCnt();});
}

// HOST receives action from guest
function hRecv(msg){
  if(msg.t==='ROLE'){
    Object.keys(G.roles).forEach(k=>{if(G.roles[k]===msg.pid)delete G.roles[k];});
    if(msg.rid) G.roles[msg.rid]=msg.pid;
    hBroadcast();
  }
  if(msg.t==='ENT'){G.ents[msg.id]=msg.e;hBroadcast();}
  if(msg.t==='LOG'){
    // Avoid duplicates (sender already added locally)
    const dominated=G.log.some(l=>l.ts===msg.e.ts&&l.msg===msg.e.msg);
    if(!dominated)G.log.push(msg.e);
    hBroadcast();
  }
  if(msg.t==='INIT_ROLL'){
    G.initRolls[msg.role]=msg.val;
    hBroadcast();
    // Check if all rolled
    hCheckInitDone();
  }
  if(msg.t==='SET_TURN_PHASE'){G.turnPhase=msg.p;hBroadcast();}
  if(msg.t==='NEXT_TURN'){hNextTurn();hBroadcast();}
  if(msg.t==='DMG'){
    const e=G.ents[msg.tgt];
    if(e){const red=Math.max(0,msg.raw-(e.ar||0));e.hp=Math.max(0,e.hp-red);}
    hBroadcast();
  }
  if(msg.t==='START_ROUND'){
    G.round=msg.round;G.state='INIT_ROLL';
    G.initRolls={};G.turnOrder=[];G.turnIdx=0;G.turnPhase='WAFFE';
    // Init rolls for all active entities
    Object.keys(G.ents).forEach(k=>{if(G.ents[k].hp>0)G.initRolls[k]=null;});
    hBroadcast();
  }
  if(msg.t==='ALL_READY'){
    // Start first round
    G.state='INIT_ROLL';
    G.initRolls={};G.turnOrder=[];G.turnIdx=0;G.turnPhase='WAFFE';
    Object.keys(G.ents).forEach(k=>{if(G.ents[k].hp>0)G.initRolls[k]=null;});
    hBroadcast();
  }
}

function hCheckInitDone(){
  const rolls=G.initRolls;
  const allDone=Object.values(rolls).every(v=>v!==null);
  if(!allDone) return;
  // Sort by roll desc
  const order=Object.keys(rolls).sort((a,b)=>rolls[b]-rolls[a]);
  G.turnOrder=order;
  G.turnIdx=0;
  // First in order — check stationary
  const firstEnt = G.ents[order[0]];
  G.turnPhase = (firstEnt && firstEnt.stationary) ? 'WAFFE' : 'BEWEGUNG';
  G.state='TURNS';
  hBroadcast();
}

function hNextTurn(){
  G.turnIdx++;
  if(G.turnIdx>=G.turnOrder.length){
    G.state='ROUND_END';
  } else {
    // Start with movement, unless entity is stationary
    const cur = G.turnOrder[G.turnIdx];
    const ent = G.ents[cur];
    G.turnPhase = (ent && ent.stationary) ? 'WAFFE' : 'BEWEGUNG';
  }
}

function hBroadcast(){
  const p={t:'FULL',G};
  conns.forEach(c=>{try{c.send(p);}catch(e){}});
  render(); // local render on host
}

// GUEST receives full state from host
function gRecv(msg){
  if(msg.t==='FULL'){G=msg.G;render();if(document.getElementById('SR').classList.contains('on'))renRoles();}
}

// Send to host (or process locally if we ARE host)
function toH(msg){
  if(ME.isHost)hRecv(msg); else if(conns[0])conns[0].send(msg);
}

function updCnt(){
  const n=ME.isHost?conns.length+1:1;
  const el=document.getElementById('rcn');if(el)el.textContent=n+' Spieler';
}

function onMinionAdj(file, delta){
  const k = KAIJU_DB[ME.kaijuIdx] || KAIJU_DB[0];
  if(!k.minionDefs) return;
  const md = k.minionDefs.find(x => x.file === file);
  if(!md) return;
  if(!ME.minionCounts) ME.minionCounts = {};
  const cur = ME.minionCounts[file] !== undefined ? ME.minionCounts[file] : md.def;
  ME.minionCounts[file] = Math.max(md.min, Math.min(md.max, cur + delta));
  const el = document.getElementById('minion-count-' + file);
  if(el) el.textContent = ME.minionCounts[file];
}

function pickRole(rid){
  Object.keys(G.roles).forEach(k=>{if(G.roles[k]===ME.id)delete G.roles[k];});
  G.roles[rid]=ME.id;ME.role=rid;
  const rd=RDEFS.find(r=>r.id===rid);
  if(rid==='monster'){
    ME.mech=null;
    if(ME.kaijuIdx===null||ME.kaijuIdx===undefined) ME.kaijuIdx=0;
    ME.kaiju={ id:'monster', ...KAIJU_DB[ME.kaijuIdx] };
    ME.mechaIdx=null;
  } else {
    // Default to first mecha if not chosen yet
    if(ME.mechaIdx===null||ME.mechaIdx===undefined) ME.mechaIdx=0;
    ME.mech={id:rid, ...MECHA_DB[ME.mechaIdx]};
    ME.kaiju=null;
  }
  toH({t:'ROLE',pid:ME.id,rid});
  renRoles();
}

function doReady(){
  if(!ME.role){document.getElementById('re').textContent='Erst Rolle wählen.';return;}
  document.getElementById('re').textContent='';
  if(ME.role==='monster'){
    const kIdx = (ME.kaijuIdx!==null && ME.kaijuIdx!==undefined) ? ME.kaijuIdx : 0;
    const k = KAIJU_DB[kIdx];
    ME.kaiju = { id:'monster', ...k };
    G.ents['monster']={id:'monster',nm:k.nm,tp:k.tp,mhp:k.hp,hp:k.hp,ar:k.ar,fl:[],isK:true,mfile:k.file,abs:k.abs,stationary:!!k.stationary};
    toH({t:'ENT',id:'monster',e:G.ents['monster']});

    // Spawn minions if kaiju has minionDefs
    if(k.minionDefs && k.minionDefs.length) {
      let minionIdx = 0;
      k.minionDefs.forEach(md => {
        const count = (ME.minionCounts && ME.minionCounts[md.file] !== undefined)
          ? ME.minionCounts[md.file]
          : md.def;
        const template = KAIJU_DB.find(x => x.file === md.file);
        if(!template) {
          console.warn('Minion template not found:', md.file);
          return;
        }
        for(let i = 0; i < count; i++) {
          const mid = 'minion_' + minionIdx;
          G.ents[mid] = {
            id: mid,
            nm: template.nm + ' #' + (i+1),
            tp: template.tp,
            mhp: template.hp, hp: template.hp, ar: template.ar,
            fl: [], isK: true, isMinion: true,
            mfile: md.file,
            abs: template.abs,
            controller: ME.id,
          };
          toH({t:'ENT', id: mid, e: G.ents[mid]});
          minionIdx++;
        }
        addLog('sys', `${count} ${template.nm}-Minions beschworen`);
      });
    }
  } else {
    const m=ME.mech;
    const palette = getPaletteForMech(m.file);
    const colorStops = palette[ME.colorIdx||0]?.stops || palette[0].stops;
    G.ents[ME.role]={id:ME.role,nm:m.nm,tp:m.tp,mhp:m.hp,hp:m.hp,ar:m.ar,fl:[],isK:false,weps:m.weps,mfile:m.file,spd:m.spd,colorStops};
    toH({t:'ENT',id:ME.role,e:G.ents[ME.role]});
  }
  const rn=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  const un=ME.role==='monster'?ME.kaiju?.nm:ME.mech?.nm;
  addLog('sys',`${rn} bereit (${un})`);
  goCombat();
}

// ── COMBAT ────────────────────────────────────────────────────
window.goCombat=goCombat;
function goCombat(){
  const isK=ME.role==='monster';
  document.getElementById('cn').textContent=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  document.getElementById('cn').style.color=isK?'var(--rd)':'var(--cy)';
  document.getElementById('cu').textContent=isK?(ME.kaiju?.nm||''):(ME.mech?.nm||'');
  go('SC');render();
}

// ── RENDER ────────────────────────────────────────────────────
let _actLock = false; // true while dice animation is showing

window.render=render;
function render(){
  renEnts();renPhase();renTurnOrder();renTurnBanner();
  if(!_actLock) renAct(); // don't overwrite action area during dice display
  renLog();
  const cr=document.getElementById('cr');if(cr)cr.textContent='RUNDE '+G.round;
}

function lockAct(ms){
  _actLock=true;
  setTimeout(()=>{_actLock=false;renAct();},ms);
}

function renEnts(){
  const el=document.getElementById('el');if(!el)return;el.innerHTML='';
  const all=Object.values(G.ents);
  if(!all.length){el.innerHTML='<div style="font-family:var(--fm);font-size:.52rem;color:var(--dm);padding:4px">Warte auf Spieler…</div>';return;}
  const cur=G.state==='TURNS'?G.turnOrder[G.turnIdx]:null;
  all.forEach(e=>{
    const im=e.id===ME.role,it=e.id===cur;
    const pct=Math.max(0,Math.round(e.hp/e.mhp*100));
    const bc=pct>60?'':pct>30?' w':' cr';
    const fl=(e.fl||[]).map(f=>`<span class="chip ${FL[f]||''}">${f}</span>`).join('');
    const d=document.createElement('div');
    d.className='ec'+(e.isK?' kai':'')+(im?' mine':'')+(it?' turn':'');
    d.innerHTML=`<div class="en" style="${e.isK?'color:var(--rd)':''}">
      ${e.nm}${im?' <span style="font-size:.4rem;color:var(--cy)">[DU]</span>':''}${it?' <span style="font-size:.4rem;color:var(--yl)">▶</span>':''}
    </div><div class="et">${e.tp}</div>
    <div class="hpt"><div class="hpf${bc}" style="width:${pct}%"></div></div>
    <div class="hptx">${e.hp}/${e.mhp} · ARM ${e.ar}</div>
    ${fl?`<div style="margin-top:2px">${fl}</div>`:''}`;
    el.appendChild(d);
  });
}

function renPhase(){
  const b=document.getElementById('ppb');if(!b)return;
  if(G.state==='INIT_ROLL'){
    b.innerHTML='<div class="ps ac">INITIATIVE</div>';return;
  }
  if(G.state==='ROUND_END'){
    b.innerHTML='<div class="ps ac">RUNDE ENDE</div>';return;
  }
  if(G.state!=='TURNS'){b.innerHTML='';return;}
  const phases=['BEWEGUNG','WAFFE','ZIEL','ANGRIFF','SCHADEN','DONE'];
  const cur=phases.indexOf(G.turnPhase);
  b.innerHTML=phases.map((p,i)=>`<div class="ps${i<cur?' dn':i===cur?' ac':''}">${p}</div>`).join('');
}

function renTurnOrder(){
  const b=document.getElementById('tob');if(!b)return;
  if(G.state!=='TURNS'&&G.state!=='ROUND_END'){b.innerHTML='';return;}
  b.innerHTML=G.turnOrder.map((rid,i)=>{
    const e=G.ents[rid];const nm=e?.nm||rid;const isK=e?.isK;
    let cls='tos';
    if(i<G.turnIdx)cls+=' done';
    else if(i===G.turnIdx)cls+=isK?' kai-active':' active';
    return`<div class="${cls}">${i+1}. ${nm} (${G.initRolls[rid]||'?'})</div>`;
  }).join('');
}

function isMyEntity(eid){
  if(eid === ME.role) return true;
  // Monster player also controls minions
  if(ME.role === 'monster' && eid && eid.startsWith('minion_')) return true;
  return false;
}

function renTurnBanner(){
  const b=document.getElementById('tbn');if(!b)return;
  if(G.state==='INIT_ROLL'){
    const allR=Object.values(G.initRolls);
    const done=allR.filter(v=>v!==null).length;
    b.className='tb wt';
    b.textContent=`INITIATIVE PHASE — ${done}/${allR.length} gewürfelt`;
    return;
  }
  if(G.state==='ROUND_END'){
    b.className='tb wt';b.textContent='RUNDE '+G.round+' ABGESCHLOSSEN';return;
  }
  if(G.state!=='TURNS'){b.className='tb wt';b.textContent='WARTE AUF SPIELER…';return;}
  const cur=G.turnOrder[G.turnIdx];
  const e=G.ents[cur];const nm=e?.nm||cur;
  const isMe=isMyEntity(cur);
  if(isMe){
    const isKaijuSide = ME.role==='monster';
    b.className='tb'+(isKaijuSide?' mk':' my');
    b.textContent='▶ DEIN ZUG — '+nm+' · '+G.turnPhase;
  } else {
    b.className='tb wt';
    b.textContent=`WARTET: ${nm} · ${G.turnPhase}`;
  }
}

// ── ACTION AREA ───────────────────────────────────────────────
function renAct(){
  const a=document.getElementById('ca');if(!a)return;

  // INIT_ROLL: everyone sees their own dice button
  if(G.state==='INIT_ROLL'){rInit(a);return;}

  // ROUND_END: monster controller can start next round
  if(G.state==='ROUND_END'){rRndEnd(a);return;}

  // TURNS: only active player sees action UI
  if(G.state!=='TURNS'){a.innerHTML='<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);padding:8px">Warte…</div>';return;}

  const cur=G.turnOrder[G.turnIdx];
  const isMe=isMyEntity(cur);

  if(!isMe){
    const e=G.ents[cur];
    a.innerHTML=`<div class="sl">WARTEN</div><div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);line-height:2;padding:8px 0">
      <span style="color:var(--th)">${e?.nm||'?'}</span> ist am Zug.<br>Phase: ${G.turnPhase}</div>`;
    return;
  }

  // My turn (could be my main unit or a controlled minion)
  const isKaijuTurn = ME.role==='monster' || (cur && cur.startsWith('minion_'));
  const fn={BEWEGUNG:rMove,WAFFE:isKaijuTurn?rKPick:rWep,ZIEL:rTgt,ANGRIFF:rAtk,SCHADEN:rDmgP,DONE:rDone};
  if(fn[G.turnPhase])fn[G.turnPhase](a);
}

// INITIATIVE — everyone rolls simultaneously
function rInit(a){
  const myRoll=G.initRolls[ME.role];
  const hasRolled=myRoll!==null&&myRoll!==undefined;
  const allRolls=Object.entries(G.initRolls);

  a.innerHTML=`<div class="sl">INITIATIVE — ALLE WÜRFELN W20</div>
    <div style="font-family:var(--fm);font-size:.62rem;color:var(--dm);margin-bottom:10px;line-height:1.8">
      Jeder würfelt gleichzeitig. Höchstes Ergebnis beginnt.
    </div>
    ${!hasRolled?`
      <div style="display:flex;justify-content:center;margin-bottom:12px">
        <button class="dc" onclick="doInit(this)">W20</button>
      </div>
      <div class="br" id="ri"></div>
    `:`
      <div style="font-family:var(--fm);font-size:.7rem;color:var(--gr);text-align:center;margin-bottom:10px">
        ✓ Du hast ${myRoll} gewürfelt. Warte auf andere…
      </div>
    `}
    <div class="sl" style="margin-top:10px">ERGEBNISSE</div>
    <div class="it" id="itk"></div>`;

  const itk=document.getElementById('itk');
  allRolls.forEach(([rid,val])=>{
    const e=G.ents[rid];const nm=e?.nm||rid;
    const d=document.createElement('div');
    d.className='itc'+(val!==null?' done':' wait');
    d.innerHTML=`<div>${nm}</div><div class="iv">${val!==null?val:'…'}</div>`;
    itk.appendChild(d);
  });
}

function doInit(btn){
  if(G.initRolls[ME.role] !== null && G.initRolls[ME.role] !== undefined) return;
  if(btn.classList.contains('used')) return;

  const n=roll(20);
  btn.className='dc used shake';
  btn.onclick=null;
  setTimeout(()=>btn.className='dc used',400);
  const el=document.getElementById('ri');
  if(el){
    el.textContent=n+(n===20?' KRITISCH!':n===1?' MIES!':'');
    el.className='br'+(n===20?' crit':n===1?' fumb':'');
  }
  lockAct(3000);
  const rn=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  addLog('roll',`${rn} Initiative: ${n}`);
  toH({t:'INIT_ROLL',role:ME.role,val:n});

  // If monster player, auto-roll initiative for all minions too
  if(ME.role === 'monster') {
    Object.keys(G.initRolls).forEach(rid => {
      if(rid.startsWith('minion_') && (G.initRolls[rid] === null || G.initRolls[rid] === undefined)) {
        const mn = roll(20);
        addLog('roll', `${G.ents[rid]?.nm||rid} Initiative: ${mn}`);
        toH({t:'INIT_ROLL', role: rid, val: mn});
      }
    });
  }
}

// MOVEMENT — 8-direction compass
function rMove(a) {
  const cur = G.turnOrder[G.turnIdx];
  const ent = G.ents[cur];
  if(!ent) return;

  // Movement points based on mecha SPD or kaiju mobility stat
  let movePoints;
  if(ent.isK) {
    // Look up the kaiju def to find mobility stat
    const kdef = KAIJU_DB.find(x => x.file === ent.mfile);
    const mobStat = kdef?.stats?.find(s => s.label === 'MOBILITÄT')?.val || 3;
    movePoints = mobStat * 2; // 1-5 mobility → 2-10 tiles
  } else {
    movePoints = ent.spd ? ent.spd * 2 : 4;
    // Mecha def
    const mdef = MECHA_DB.find(m => m.file === ent.mfile);
    if(mdef) movePoints = mdef.spd * 2;
  }

  const used = ent.movedThisTurn || 0;
  const left = Math.max(0, movePoints - used);

  a.innerHTML = `
    <div class="sl">BEWEGUNG</div>
    <div style="font-family:var(--fm);font-size:.62rem;color:var(--dm);margin-bottom:8px;line-height:1.6">
      Bewegungspunkte: <span style="color:var(--th)">${left}/${movePoints}</span>
    </div>
    <div class="compass" id="compass-grid"></div>
    <div style="font-family:var(--fm);font-size:.56rem;color:var(--dm);text-align:center;margin-top:6px">
      Position: (${Math.round(ent.pos?.x||0)}, ${Math.round(ent.pos?.z||0)})
    </div>
    <button class="btn c" style="width:100%;margin-top:10px" onclick="finishMove()">BEWEGUNG BEENDEN →</button>
  `;

  // Build compass — 3x3 grid with center blank
  const compass = document.getElementById('compass-grid');
  const dirs = [
    { lbl:'NW', dx:-1, dz:-1 }, { lbl:'N',  dx: 0, dz:-1 }, { lbl:'NO', dx: 1, dz:-1 },
    { lbl:'W',  dx:-1, dz: 0 }, { lbl:'',   dx: 0, dz: 0 }, { lbl:'O',  dx: 1, dz: 0 },
    { lbl:'SW', dx:-1, dz: 1 }, { lbl:'S',  dx: 0, dz: 1 }, { lbl:'SO', dx: 1, dz: 1 },
  ];
  dirs.forEach(d => {
    const btn = document.createElement('button');
    if(d.lbl === '') {
      btn.className = 'compass-center';
      btn.textContent = '●';
      btn.disabled = true;
    } else {
      btn.className = 'compass-btn' + (left <= 0 ? ' dim' : '');
      btn.textContent = d.lbl;
      btn.onclick = () => doMove(d.dx, d.dz);
    }
    compass.appendChild(btn);
  });
}

function doMove(dx, dz) {
  const cur = G.turnOrder[G.turnIdx];
  const ent = G.ents[cur];
  if(!ent || !ent.pos) return;

  // Movement points check
  let movePoints;
  if(ent.isK) {
    const kdef = KAIJU_DB.find(x => x.file === ent.mfile);
    movePoints = (kdef?.stats?.find(s => s.label === 'MOBILITÄT')?.val || 3) * 2;
  } else {
    const mdef = MECHA_DB.find(m => m.file === ent.mfile);
    movePoints = (mdef ? mdef.spd : 3) * 2;
  }
  const used = ent.movedThisTurn || 0;
  if(used >= movePoints) return;

  // Diagonal = 1.5 cost (rounded), straight = 1
  const cost = (dx !== 0 && dz !== 0) ? 1.5 : 1;
  if(used + cost > movePoints) return;

  // Update position (keep on grid 0-44)
  const newX = Math.max(0, Math.min(44, (ent.pos.x || 22) + dx));
  const newZ = Math.max(0, Math.min(44, (ent.pos.z || 22) + dz));

  ent.pos = { x: newX, z: newZ };
  ent.movedThisTurn = used + cost;

  addLog('sys', `${ent.nm} bewegt sich nach ${dx > 0 ? 'O' : dx < 0 ? 'W' : ''}${dz > 0 ? 'S' : dz < 0 ? 'N' : ''} → (${Math.round(newX)},${Math.round(newZ)})`);

  // Send entity update to host
  toH({ t:'ENT', id: cur, e: ent });

  // Update 3D position immediately
  if(window.update3DPositions) window.update3DPositions();

  // Re-render the compass with updated points
  renAct();
}

function finishMove() {
  // Reset movedThisTurn for next turn
  const cur = G.turnOrder[G.turnIdx];
  const ent = G.ents[cur];
  if(ent) {
    ent.movedThisTurn = 0;
    toH({ t:'ENT', id: cur, e: ent });
  }
  setTP('WAFFE');
}

// MONSTER PICK — uses current turn entity's abilities
function rKPick(a){
  const cur = G.turnOrder[G.turnIdx];
  const ent = G.ents[cur];
  // Use the entity's abilities if available (kaiju or minion), fall back to ME.kaiju
  let k;
  if(ent && ent.abs) {
    k = ent; // entity carries its own ability list
  } else {
    k = ME.kaiju || KAIJU_DB[0];
  }
  const absList = k.abs || k.ab || [];
  a.innerHTML=`<div class="sl">KAIJU AKTION</div>
    <div class="ec kai" style="margin-bottom:8px"><div class="en" style="color:var(--rd)">${k.nm}</div>
    <div class="et">${k.tp||''}</div>
    <div style="font-family:var(--fm);font-size:.54rem;color:var(--dm);margin-top:2px">★ ${k.sp}</div></div>
    <div class="sl">FÄHIGKEITEN</div><div id="al"></div>
    <button class="btn r" style="margin-top:7px" onclick="setTP('ZIEL')">WEITER →</button>`;
  const al=document.getElementById('al');
  absList.forEach(abId=>{
    const atk = KATK[abId];
    const label = atk ? atk.nm : abId;
    const meta = atk ? `<div style="font-family:var(--fm);font-size:.5rem;color:var(--dm);margin-top:1px">${atk.t} · ${atk.d}${atk.x?' · '+atk.x:''}</div>` : '';
    const b=document.createElement('button');
    b.className='ab';
    b.innerHTML = `<div>${label}</div>${meta}`;
    b.onclick=()=>{
      document.querySelectorAll('#al .ab').forEach(x=>x.style.borderColor='');
      b.style.borderColor='var(--rd)';
      // Store ability id for later weapon lookup
      T.wep='__k_'+abId;
      addLog('phase',`★ KAIJU: ${label}`);
    };
    al.appendChild(b);
  });
}

// WEAPON
function getWep(id){
  if(!id) return null;
  if(id.startsWith('__k_')) {
    const aid = id.slice(4);
    return KATK[aid] || { nm: aid, d:'3W6', t:'PSYCHIC', r:'MITTEL', x:'' };
  }
  return ITEMS[id]||WEPS[id]||null;
}
function rWep(a){
  const e=G.ents[ME.role];const ws=e?.weps||[];
  a.innerHTML=`<div class="sl">WAFFE WÄHLEN</div><div id="wl"></div><div id="wk" style="margin-top:7px"></div>`;
  const wl=document.getElementById('wl');
  ws.forEach(wid=>{
    const w=getWep(wid);if(!w)return;
    const name=w.nm||w.n;
    const d=document.createElement('div');d.className='wo'+(T.wep===wid?' sel':'');
    d.innerHTML=`<div class="wbd">${w.t}</div><div><div class="wn">${name}</div><div class="ws">${w.d} · ${w.r}${w.x?' · '+w.x:''}</div></div>`;
    d.onclick=()=>{T.wep=wid;renAct();};
    wl.appendChild(d);
  });
  if(T.wep&&getWep(T.wep)){
    const btn=document.createElement('button');
    btn.className='btn c';
    btn.textContent='BESTÄTIGEN →';
    btn.onclick=()=>{
      const w=getWep(T.wep);
      addLog('sys','Waffe: '+(w.nm||w.n||''));
      setTP('ZIEL');
    };
    const wk=document.getElementById('wk');
    wk.innerHTML='';
    wk.appendChild(btn);
  }
}

// TARGET
function rTgt(a){
  const tgts=Object.values(G.ents).filter(e=>ME.role==='monster'?!e.isK&&e.hp>0:e.isK&&e.hp>0);
  a.innerHTML=`<div class="sl">ZIEL WÄHLEN</div><div id="tl"></div>`;
  const tl=document.getElementById('tl');
  if(!tgts.length){tl.innerHTML='<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);padding:8px">Keine Ziele.</div>';return;}
  tgts.forEach(e=>{
    const pct=Math.max(0,Math.round(e.hp/e.mhp*100));const bc=pct>60?'':pct>30?' w':' cr';
    const d=document.createElement('div');d.className='ec'+(e.isK?' kai':'')+(T.tgt===e.id?' turn':'');d.style.cursor='pointer';
    d.innerHTML=`<div class="en" style="${e.isK?'color:var(--rd)':''}">→ ${e.nm}</div><div class="et">${e.tp}</div>
      <div class="hpt"><div class="hpf${bc}" style="width:${pct}%"></div></div><div class="hptx">${e.hp}/${e.mhp} · ARM ${e.ar}</div>`;
