    tl.appendChild(cd);}
}

// ATTACK
function rAtk(a){
  const w=getWep(T.wep),t=G.ents[T.tgt],isKA=T.wep?.startsWith('__k_');
  a.innerHTML=`<div class="sl">ANGRIFFSWURF</div>
    ${w?`<div class="ec" style="margin-bottom:7px;border-color:var(--bh)"><div class="en">${w.nm||w.n}</div><div class="et">${w.t} · ${w.d}${w.x?' · '+w.x:''}</div></div>`:''}
    ${isKA?`<div class="ec kai" style="margin-bottom:7px"><div class="en" style="color:var(--rd)">${T.wep.replace('__k_','')}</div></div>`:''}
    ${t?`<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);margin-bottom:9px">→ ${t.nm} (ARM ${t.ar})</div>`:''}
    <div style="display:flex;justify-content:center;margin-bottom:11px"><button class="dc" onclick="doAtk(this)">W20</button></div>
    <div class="br" id="ra"></div>`;
}
function doAtk(btn){
  // Guard: already rolled?
  if(T.atkRolled) return;
  if(btn.classList.contains('used')) return;
  T.atkRolled = true;

  const n=roll(20);T.atk=n;
  btn.className='dc used shake';
  btn.onclick=null;
  setTimeout(()=>btn.className='dc used',400);
  const el=document.getElementById('ra');
  el.textContent=n+(n===20?' KRITISCH!':n===1?' PATZER!':'');
  el.className='br'+(n===20?' crit':n===1?' fumb':'');
  lockAct(2500);
  addLog('roll',`${myName()} Angriff: ${n}${n===20?' [KRIT]':n===1?' [PATZER]':''}`);

  // ── Trigger 3D weapon effect ──
  if(window.play3DEffect) {
    const wep = getWep(T.wep);
    window.play3DEffect(ME.role, T.tgt, wep, n===1);
  }

  if(n===1){
    addLog('dmg','Patzer — kein Schaden!');
    setTimeout(()=>{_actLock=false;setTP('DONE');},2500);
  } else {
    setTimeout(()=>{
      _actLock=false;
      const el2=document.getElementById('ra');
      if(el2&&el2.parentElement){
        const cb=document.createElement('div');
        cb.style.marginTop='12px';
        const wbtn=document.createElement('button');
        wbtn.className='btn c';
        wbtn.style.width='100%';
        wbtn.textContent='WEITER ZUM SCHADEN →';
        wbtn.onclick=()=>setTP('SCHADEN');
        cb.appendChild(wbtn);
        el2.parentElement.appendChild(cb);
      }
    },2500);
  }
}

// DAMAGE
function rDmgP(a){
  const w=getWep(T.wep),isKA=T.wep?.startsWith('__k_');
  const isCrit=T.atk===20;
  const nota=w?w.d:(isKA?'3W8':'2W6');
  a.innerHTML=`<div class="sl">SCHADEN WÜRFELN</div>
    <div style="font-family:var(--fm);font-size:.63rem;color:var(--dm);margin-bottom:10px">Würfel: <span style="color:var(--yl)">${nota}${isCrit?' × 2 (KRIT)':''}</span></div>
    <div style="display:flex;justify-content:center;margin-bottom:11px"><button class="dc" onclick="doDmgRoll(this,'${nota}')">WÜRFELN</button></div>
    <div class="br" id="rd2"></div><div id="dca" style="margin-top:9px"></div>`;
}
function doDmgRoll(btn,nota){
  let n=rollD(nota);if(T.atk===20)n*=2;T.dmg=n;
  btn.className='dc used';
  const el=document.getElementById('rd2');
  el.textContent=n+(T.atk===20?' [KRIT ×2]':'');el.className='br'+(T.atk===20?' crit':'');
  lockAct(60000); // lock until player clicks apply
  addLog('roll',`${myName()} Schaden: ${n}${T.atk===20?' [KRIT]':''}`);
  // Show apply button after short delay for dramatic effect
  setTimeout(()=>{
    const dca=document.getElementById('dca');
    if(dca)dca.innerHTML='<button class="btn r" style="width:100%;padding:12px 16px;font-size:.65rem" onclick="_actLock=false;openDM()">SCHADEN ANWENDEN (${n}) →</button>';
  },800);
}
function openDM(){
  const t=G.ents[T.tgt];
  const raw=T.dmg||0;
  const arm=t?.ar||0;
  const final=Math.max(0, raw - arm);
  document.getElementById('mdt').textContent='Ziel: '+(t?.nm||'?');
  document.getElementById('mdroll').textContent=raw;
  document.getElementById('mdarm').textContent='Rüstung: −'+arm;
  document.getElementById('mdfinal').textContent='→ '+final+' effektiver Schaden';
  document.getElementById('mdv').value=raw; // hidden field carries the raw value
  openM('md');
}
function doDmg(){
  const raw=parseInt(document.getElementById('mdv').value)||0;
  closeM('md');
  _actLock=false; // unlock action area
  const t=G.ents[T.tgt];
  const red=Math.max(0,raw-(t?.ar||0));
  addLog('dmg',`${t?.nm||'?'} −${red} HP (${raw}−${t?.ar||0}) → ${Math.max(0,(t?.hp||0)-red)}/${t?.mhp||0}`);
  if(t&&t.hp-red<=0)addLog('dmg',`⚠ ${t.nm} AUSGESCHALTET!`);
  toH({t:'DMG',tgt:T.tgt,raw});
  setTimeout(()=>setTP('DONE'),500);
}

// DONE — turn finished, advance to next player
function rDone(a){
  a.innerHTML=`<div class="sl">ZUG ABGESCHLOSSEN</div>
    <div style="font-family:var(--fm);font-size:.66rem;color:var(--gr);text-align:center;padding:10px 0;line-height:2">
      ✓ Dein Zug ist beendet.
    </div>
    <button class="btn c" style="width:100%" onclick="endMyTurn()">NÄCHSTER SPIELER →</button>`;
}
function endMyTurn(){
  T={wep:null,tgt:null,atk:null,dmg:null,atkRolled:false,dmgRolled:false};
  toH({t:'NEXT_TURN'});
}

// ROUND END
function rRndEnd(a){
  const isM=ME.role==='monster';
  a.innerHTML=`<div class="sl">RUNDE ${G.round} ABGESCHLOSSEN</div>
    <div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);margin-bottom:11px;line-height:1.8">Alle Züge abgeschlossen.</div>
    ${isM?`<button class="btn g" style="width:100%" onclick="nextRound()">NÄCHSTE RUNDE →</button>`
    :`<div style="font-family:var(--fm);font-size:.58rem;color:var(--dm)">Monster-Controller startet nächste Runde.</div>`}`;
}
function nextRound(){
  addLog('phase',`══ RUNDE ${G.round+1} BEGINNT ══`);
  toH({t:'START_ROUND',round:G.round+1});
}

// ── SET TURN PHASE ────────────────────────────────────────────
function setTP(p){
  // Reset roll guards when phase changes
  T.atkRolled = false;
  T.dmgRolled = false;
  G.turnPhase=p;
  toH({t:'SET_TURN_PHASE',p});
  render();
}

// ── LOG ───────────────────────────────────────────────────────
function addLog(type,msg){
  const ts=new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const e={type,msg,ts};
  // Only send to host — host adds to G.log and broadcasts back
  // But we also need local display immediately for the sender
  if(!G.log.includes(e)) G.log.push(e); // local for immediate display
  renLog();
  toH({t:'LOG',e});
}

function renLog(){
  const l=document.getElementById('cl');if(!l)return;l.innerHTML='';
  (G.log||[]).forEach(e=>{
    const d=document.createElement('div');d.className='lr '+(e.type||'');
    d.innerHTML=`<span class="ts">${e.ts||''}</span><span class="m">${e.msg}</span>`;
    l.appendChild(d);
  });
  l.scrollTop=l.scrollHeight;
}

// ── START COMBAT (first time) ─────────────────────────────────
// The first player to go to combat sends ALL_READY
// which triggers INIT_ROLL on host.
// But we need ALL players ready first.
// Simple approach: each player goes to combat screen.
// When they click a "START KAMPF" button, it triggers the init phase.
// We show a "waiting for combat start" until state changes.

// Actually let's add a START button on combat screen if state is still LOBBY
// Only host/monster can press it.

// ── DICE ──────────────────────────────────────────────────────
function roll(n){return Math.floor(Math.random()*n)+1;}
function rollD(s){const m=s.match(/(\d+)[Wd](\d+)(?:\+(\d+))?/);if(!m)return 0;let t=0;for(let i=0;i<+m[1];i++)t+=roll(+m[2]);if(m[3])t+=+m[3];return t;}
function rnd(){return Math.random().toString(36).slice(2,10);}
function myName(){
  // If a minion is the current entity, use its name
  if(G.state === 'TURNS') {
    const cur = G.turnOrder[G.turnIdx];
    if(cur && cur.startsWith('minion_') && G.ents[cur]) {
      return G.ents[cur].nm;
    }
  }
  return RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
}

// ── SCREEN/MODAL ──────────────────────────────────────────────
function go(id){document.querySelectorAll('.S').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on');}
function openM(id){document.getElementById(id)?.classList.add('on');}
function closeM(id){document.getElementById(id)?.classList.remove('on');}

// Patch renAct for LOBBY state — show start button
const _renAct=renAct;
// Override: if state LOBBY show start button
function renActWrap(){
  const a=document.getElementById('ca');if(!a)return;
  if(G.state==='LOBBY'){
    const entCount=Object.keys(G.ents).length;
    const canStart=entCount>=2; // at least 2 entities (1 player + monster)
    a.innerHTML=`<div class="sl">BEREIT</div>
      <div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);padding:8px 0;line-height:2;text-align:center">
        ${entCount} Einheit${entCount!==1?'en':''} bereit.<br>
        ${canStart?'Starte den Kampf wenn alle bereit sind.':'Warte bis mindestens 2 Spieler bereit sind.'}
      </div>
      ${canStart?`<button class="btn g" style="width:100%" onclick="startCombat()">⚔ KAMPF STARTEN</button>`:''}`;
    return;
  }
  _renAct(); // call original
}
// Replace renAct
renAct=renActWrap;

function startCombat(){
  addLog('phase',`══ RUNDE 1 — KAMPF BEGINNT ══`);
  toH({t:'ALL_READY'});
}

// ── VIEWPORT ──────────────────────────────────────────────────
(function vh(){document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px')})();
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'));});
console.log('%cKAIJU SKIRMISH v0.4','color:#00c8f0;font-family:monospace;font-weight:bold;font-size:13px');
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

// ═══════════════════════════════════════════════════════════
//  3D BATTLEFIELD
//  45x45 tile grid, 1 tile = 1 unit
//  Spawn: players bottom half, kaiju top half
// ═══════════════════════════════════════════════════════════

const GRID = 45;
const TILE = 1; // 1 unit per tile
const BASE_URL = 'https://birdbrain1991.github.io/TornRealms/';

let scene, camera, renderer, controls;
let gridMesh;
let unitMeshes = {}; // roleId -> { mesh, pos:{x,z}, label }
let initialized = false;

// Expose to global scope so main script can call
window.init3D = init3D;
window.update3DPositions = update3DPositions;
window.getDistanceTiles = getDistanceTiles;

function init3D() {
  if (initialized) return;
  const container = document.getElementById('viewport3d');
  if (!container) return;

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a14);
  scene.fog = new THREE.FogExp2(0x1a1a14, 0.010);

  // Camera — isometric-ish angle looking down at grid
  const w = container.clientWidth, h = container.clientHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 200);
  camera.position.set(22, 35, 50);
  camera.lookAt(22, 0, 22);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // Insert canvas as first child (before overlay)
  container.insertBefore(renderer.domElement, container.firstChild);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(22, 0, 22);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.45;
  controls.minDistance = 15;
  controls.maxDistance = 80;
  controls.update();

  // Lights
  const amb = new THREE.AmbientLight(0x6a7a55, 1.1);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xfff4d8, 1.6);
  dir.position.set(20, 40, 30);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  dir.shadow.camera.near = 1;
  dir.shadow.camera.far = 100;
  dir.shadow.camera.left = -30;
  dir.shadow.camera.right = 30;
  dir.shadow.camera.top = 30;
  dir.shadow.camera.bottom = -30;
  scene.add(dir);

  // Point light for atmosphere
  const pt = new THREE.PointLight(0xcc3322, 0.5, 60);
  pt.position.set(22, 10, 22);
  scene.add(pt);

  // Grid floor
  buildGrid();

  // Resize handler
  const ro = new ResizeObserver(() => {
    const w2 = container.clientWidth, h2 = container.clientHeight;
    if (w2 === 0 || h2 === 0) return;
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
    renderer.setSize(w2, h2);
  });
  ro.observe(container);

  initialized = true;
  animate();
}

function buildGrid() {
  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(GRID, GRID);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x3a3527,
    roughness: 0.95,
    metalness: 0.05,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(GRID / 2 - 0.5, -0.01, GRID / 2 - 0.5);
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines
  const gridHelper = new THREE.GridHelper(GRID, GRID, 0x4a4a35, 0x2a2820);
  gridHelper.position.set(GRID / 2 - 0.5, 0, GRID / 2 - 0.5);
  scene.add(gridHelper);

  // Spawn zone indicators
  // Player zone: bottom (z > 30)
  const pZoneGeo = new THREE.PlaneGeometry(GRID, 14);
  const pZoneMat = new THREE.MeshBasicMaterial({ color: 0x4a6a2a, transparent: true, opacity: 0.06 });
  const pZone = new THREE.Mesh(pZoneGeo, pZoneMat);
  pZone.rotation.x = -Math.PI / 2;
  pZone.position.set(GRID / 2 - 0.5, 0.01, 37);
  scene.add(pZone);

  // Kaiju zone: top (z < 14)
  const kZoneGeo = new THREE.PlaneGeometry(GRID, 14);
  const kZoneMat = new THREE.MeshBasicMaterial({ color: 0xcc3322, transparent: true, opacity: 0.06 });
  const kZone = new THREE.Mesh(kZoneGeo, kZoneMat);
  kZone.rotation.x = -Math.PI / 2;
  kZone.position.set(GRID / 2 - 0.5, 0.01, 7);
  scene.add(kZone);

  // Border edges glow
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(GRID, 0.05, GRID));
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x5a5238 });
  const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
  edgeLine.position.set(GRID / 2 - 0.5, 0, GRID / 2 - 0.5);
  scene.add(edgeLine);
}

// Spawn positions
function getSpawnPos(roleId, index) {
  if (roleId === 'monster') {
    // Kaiju: center-top
    return { x: 22, z: 6 };
  }
  if (roleId && roleId.startsWith('minion_')) {
    // Minions spawn in formation around the kaiju center (22, 6)
    // Arrange in a circle/arc around the kaiju
    const i = parseInt(roleId.split('_')[1]) || 0;
    const angle = (i / 8) * Math.PI * 2; // up to 8 minions, distributed around
    const radius = 5 + (i % 2) * 1.5; // slight ring variation
    return {
      x: 22 + Math.cos(angle) * radius,
      z: 6 + Math.sin(angle) * radius + 4, // slightly south of kaiju
    };
  }
  // Players: spread across bottom
  const offsets = [
    { x: 15, z: 38 },
    { x: 22, z: 40 },
    { x: 29, z: 38 },
    { x: 22, z: 36 },
  ];
  return offsets[index % offsets.length];
}

// Create or update unit meshes based on G.ents
function update3DPositions() {
  if (!initialized || !scene) return;
  
  // Access global G
  const G = window.G;
  if (!G || !G.ents) return;

  const loader = new GLTFLoader();
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://unpkg.com/three@0.162.0/examples/jsm/libs/draco/');
  loader.setDRACOLoader(dracoLoader);
  // Meshopt decoder for meshopt-compressed GLBs
  loader.setMeshoptDecoder(MeshoptDecoder);
  // KTX2 for compressed textures
  const ktx2 = new KTX2Loader();
  ktx2.setTranscoderPath('https://unpkg.com/three@0.162.0/examples/jsm/libs/basis/');
  if (renderer) ktx2.detectSupport(renderer);
  loader.setKTX2Loader(ktx2);
  let playerIdx = 0;

  Object.values(G.ents).forEach(ent => {
    const id = ent.id;

    // Already have a mesh?
    if (unitMeshes[id]) {
      if (ent.pos) {
        // Smooth lerp could be added; for now, snap
        unitMeshes[id].mesh.position.x = ent.pos.x;
        unitMeshes[id].mesh.position.z = ent.pos.z;
        // Also update the glow underneath
        if (unitMeshes[id].glow) {
          unitMeshes[id].glow.position.x = ent.pos.x;
          unitMeshes[id].glow.position.z = ent.pos.z;
        }
        unitMeshes[id].pos = { x: ent.pos.x, z: ent.pos.z };
      }
      unitMeshes[id].mesh.visible = ent.hp > 0;
      return;
    }

    // Determine spawn position
    const spawn = getSpawnPos(id, playerIdx);
    if (!ent.isK) playerIdx++;

    // Store position in entity for syncing
    if (!ent.pos) ent.pos = { x: spawn.x, z: spawn.z };

    if (ent.isK) {
      const isMinion = !!ent.isMinion;
      // KAIJU or MINION: load GLB model
      const mesh = new THREE.Group();
      mesh.position.set(spawn.x, 0, spawn.z);
      scene.add(mesh);

      // Glow underneath - smaller for minions
      const glowRadius = isMinion ? 1.5 : 3;
      const glowGeo = new THREE.CircleGeometry(glowRadius, 16);
      const glowMat = new THREE.MeshBasicMaterial({
        color: isMinion ? 0xcc6622 : 0xf03040,
        transparent: true, opacity: 0.15
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(spawn.x, 0.02, spawn.z);
      scene.add(glow);

      // Placeholder box - smaller for minions
      const boxSize = isMinion ? 1.2 : 3;
      const boxHeight = isMinion ? 1.5 : 4;
      const tmpGeo = new THREE.BoxGeometry(boxSize, boxHeight, boxSize);
      const tmpMat = new THREE.MeshStandardMaterial({
        color: isMinion ? 0xcc6622 : 0xf03040,
        emissive: isMinion ? 0x301808 : 0x400000,
        roughness: 0.5, metalness: 0.3
      });
      const tmp = new THREE.Mesh(tmpGeo, tmpMat);
      tmp.position.y = boxHeight / 2;
      tmp.castShadow = true;
      mesh.add(tmp);

      unitMeshes[id] = { mesh, pos: spawn, glow, tmp, isMinion };

      // Load kaiju model
      const kFileBase = ent.mfile || 'test';
      const kaijuUrl = BASE_URL + 'kaiju-' + kFileBase + '.glb';
      console.log('[3D] Loading kaiju from:', kaijuUrl, isMinion ? '(minion)' : '');

      loader.load(kaijuUrl, (gltf) => {
        console.log('[3D] Kaiju loaded:', kFileBase);
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
        });
        // Scale down for minions
        if (isMinion) {
          model.scale.setScalar(0.35);
        }
        model.position.set(0, 0, 0);

        // Remove placeholder, add model
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          unitMeshes[id].tmp = null;
        }
        mesh.add(model);
        unitMeshes[id].model = model;
      },
      (xhr) => {
        if (xhr.total > 0) console.log('[3D] Loading kaiju: ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
      },
      (err) => {
        console.warn('[3D] Failed to load kaiju model:', err.message || err);
        console.warn('[3D] URL was:', kaijuUrl);
        // Diagnose: fetch raw bytes and inspect
        fetch(kaijuUrl).then(r => {
          console.warn('[3D] HTTP status:', r.status, '· Content-Type:', r.headers.get('content-type'), '· Content-Length:', r.headers.get('content-length'));
          return r.arrayBuffer();
        }).then(buf => {
          console.warn('[3D] Downloaded byte length:', buf.byteLength);

          // Show first 200 bytes as text — if it's an LFS pointer or HTML error page, this will be readable
          try {
            const td = new TextDecoder('utf-8', { fatal: false });
            const slice = buf.slice(0, Math.min(200, buf.byteLength));
            const text = td.decode(slice);
            console.warn('[3D] First bytes as text:\n' + text);

            if(text.startsWith('version https://git-lfs')) {
              console.warn('[3D] → THIS IS A GIT LFS POINTER, NOT THE ACTUAL FILE.');
              console.warn('[3D] → GitHub Pages does NOT serve LFS files directly.');
              console.warn('[3D] → SOLUTIONS:');
              console.warn('[3D]    1. Remove file from LFS and re-add as normal: git lfs untrack "*.glb"');
              console.warn('[3D]       then: git rm --cached <file>; git add <file>; git commit; git push');
              console.warn('[3D]    2. Or host the GLB files elsewhere (e.g. jsDelivr, Cloudflare R2)');
            } else if(text.startsWith('<!DOCTYPE') || text.startsWith('<html')) {
              console.warn('[3D] → Got an HTML page instead of GLB (probably 404).');
            }
          } catch(e) { console.warn('[3D] Could not decode bytes as text:', e); }

          if(buf.byteLength >= 20) {
            const v = new DataView(buf);
            const magic = String.fromCharCode(v.getUint8(0), v.getUint8(1), v.getUint8(2), v.getUint8(3));
            console.warn('[3D] GLB magic bytes:', magic, '(should be "glTF")');
          }
        }).catch(e => console.warn('[3D] Diagnose fetch failed:', e));
      });
    } else {
      // MECHA: load GLB
      const mesh = new THREE.Group();
      mesh.position.set(spawn.x, 0, spawn.z);
      scene.add(mesh);

      // Glow underneath while loading — use entity's color
      const tintColor = ent.colorStops ? parseInt(ent.colorStops[1].replace('#',''), 16) : 0x6a8a3a;
      const glowGeo = new THREE.CircleGeometry(1.2, 16);
      const glowMat = new THREE.MeshBasicMaterial({ color: tintColor, transparent: true, opacity: 0.2 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(spawn.x, 0.02, spawn.z);
      scene.add(glow);

      // Temporary cylinder placeholder
      const tmpGeo = new THREE.CylinderGeometry(0.4, 0.4, 2, 8);
      const tmpMat = new THREE.MeshStandardMaterial({ color: tintColor, emissive: 0x1a2a08 });
      const tmp = new THREE.Mesh(tmpGeo, tmpMat);
      tmp.position.y = 1;
      mesh.add(tmp);

      unitMeshes[id] = { mesh, pos: spawn, glow, tmp };

      // Load actual model
      const fileBase = ent.mfile || 'test';
      const modelUrl = BASE_URL + 'mecha-' + fileBase + '.glb';
      console.log('[3D] Loading mecha from:', modelUrl);
      
      loader.load(modelUrl, (gltf) => {
        console.log('[3D] Mecha loaded successfully');
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            // Apply color tint based on entity colorStops
            if (ent.colorStops && ent.colorStops.length >= 3) {
              applyGradientTint(child, ent.colorStops);
            }
          }
        });
        // Auto-scale: fit to ~2 units tall
        const box3 = new THREE.Box3().setFromObject(model);
        const sz = new THREE.Vector3();
        box3.getSize(sz);
        const maxDim = Math.max(sz.x, sz.y, sz.z, 0.01);
        const s = 2.5 / maxDim;
        model.scale.setScalar(s);
        
        // Re-calc bounds after scaling
        const box3b = new THREE.Box3().setFromObject(model);
        // Place model so bottom sits on ground
        model.position.y = -box3b.min.y;
        // Center X/Z
        const center = new THREE.Vector3();
        box3b.getCenter(center);
        model.position.x = -center.x;
        model.position.z = -center.z;

        // Remove temp cylinder, add model
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          unitMeshes[id].tmp = null;
        }
        model.rotation.y = Math.PI; // 180° drehen
        mesh.add(model);
        unitMeshes[id].model = model;
      }, 
      // Progress
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.round(xhr.loaded / xhr.total * 100);
          console.log('[3D] Loading mecha: ' + pct + '%');
        }
      },
      // Error — make the placeholder a visible cyan mecha-box instead of cylinder
      (err) => {
        console.warn('[3D] Failed to load mecha model:', err.message || err);
        console.warn('[3D] URL was:', modelUrl);
        console.warn('[3D] Make sure mecha-test.glb exists at that URL');
        // Replace cylinder with a visible box as fallback
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          // Mecha-shaped box fallback
          const fbGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
          const fbMat = new THREE.MeshStandardMaterial({ 
            color: 0x6a8a3a, emissive: 0x1a2a08, roughness: 0.6, metalness: 0.5 
          });
          const fb = new THREE.Mesh(fbGeo, fbMat);
          fb.position.y = 1;
          fb.castShadow = true;
          mesh.add(fb);
          unitMeshes[id].tmp = fb;
          // Also add a "head"
          const headGeo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
          const head = new THREE.Mesh(headGeo, fbMat);
          head.position.y = 2.2;
          head.castShadow = true;
          mesh.add(head);
          // Shoulders
          const shGeo = new THREE.BoxGeometry(1.4, 0.3, 0.6);
          const sh = new THREE.Mesh(shGeo, fbMat);
          sh.position.y = 1.8;
          sh.castShadow = true;
          mesh.add(sh);
        }
      });
    }
  });

  updateDistanceOverlay();
}

// Distance measurement between all units (in tiles)
function getDistanceTiles(a, b) {
  if (!a || !b) return 0;
  const dx = a.x - b.x;
  const dz = a.z - b.z;
  return Math.round(Math.sqrt(dx * dx + dz * dz));
}

function updateDistanceOverlay() {
  const overlay = document.getElementById('dist-overlay');
  if (!overlay) return;
  overlay.innerHTML = '';

  const ids = Object.keys(unitMeshes);
  if (ids.length < 2) return;

  // Show distances from current player's unit to all others
  const ME = window.ME;
  const myId = ME?.role;
  const myUnit = unitMeshes[myId];
  if (!myUnit) return;

  ids.forEach(id => {
    if (id === myId) return;
    const other = unitMeshes[id];
    const G = window.G;
    const ent = G?.ents?.[id];
    if (!ent || ent.hp <= 0) return;

    const dist = getDistanceTiles(myUnit.pos, other.pos);
    const tag = document.createElement('span');
    tag.className = 'dist-tag';
    tag.style.color = ent.isK ? 'var(--rd)' : 'var(--cy)';
    tag.textContent = `${ent.nm}: ${dist} Tiles`;
    overlay.appendChild(tag);
  });
}

// ═══════════════════════════════════════════════════════════
//  WEAPON EFFECTS — projectiles, beams, rockets, etc.
// ═══════════════════════════════════════════════════════════
const activeEffects = []; // { mesh, update, expireAt }

// Apply 3-stop vertical gradient to a mesh's material
// Uses world-space Y to interpolate top → mid → bottom colors
function applyGradientTint(mesh, stops) {
  if (!mesh.material) return;
  if (!mesh.geometry) return;

  // Compute the mesh's local bounding box (model space) to map Y to gradient
  if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
  const bb = mesh.geometry.boundingBox;
  const yMin = bb.min.y;
  const yMax = bb.max.y;

  const cTop = new THREE.Color(stops[0]);
  const cMid = new THREE.Color(stops[1]);
  const cBot = new THREE.Color(stops[2]);

  // Clone material so we don't affect other instances
  const oldMat = mesh.material;
  const newMat = oldMat.clone();
  newMat.color = new THREE.Color(0xffffff); // white base, gradient comes from shader

  if ('roughness' in newMat) newMat.roughness = 0.7;
  if ('metalness' in newMat) newMat.metalness = 0.4;

  // Inject gradient via onBeforeCompile — works with MeshStandardMaterial lighting
  newMat.onBeforeCompile = (shader) => {
    shader.uniforms.uYMin   = { value: yMin };
    shader.uniforms.uYMax   = { value: yMax };
    shader.uniforms.uColTop = { value: cTop };
    shader.uniforms.uColMid = { value: cMid };
    shader.uniforms.uColBot = { value: cBot };

    // Pass local Y to fragment shader
    shader.vertexShader =
      'varying float vGradY;\n' +
      shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vGradY = position.y;'
      );

    shader.fragmentShader =
      'varying float vGradY;\n' +
      'uniform float uYMin;\n' +
      'uniform float uYMax;\n' +
      'uniform vec3 uColTop;\n' +
      'uniform vec3 uColMid;\n' +
      'uniform vec3 uColBot;\n' +
      shader.fragmentShader.replace(
        '#include <color_fragment>',
        `
        #include <color_fragment>
        // 3-stop gradient based on local Y, normalized 0..1 (bottom..top)
        float gradT = clamp((vGradY - uYMin) / max(uYMax - uYMin, 0.0001), 0.0, 1.0);
        vec3 gradCol;
        if (gradT < 0.5) {
          gradCol = mix(uColBot, uColMid, gradT * 2.0);
        } else {
          gradCol = mix(uColMid, uColTop, (gradT - 0.5) * 2.0);
        }
        diffuseColor.rgb *= gradCol;
        `
      );
  };
  // Mark material as needing recompile
  newMat.needsUpdate = true;

  mesh.material = newMat;
}

function getUnitWorldPos(roleId, heightOffset = 1) {
  const u = unitMeshes[roleId];
  if (!u) return null;
  const p = new THREE.Vector3();
  u.mesh.getWorldPosition(p);
  p.y += heightOffset;
  return p;
}

// Main entry — called from main script with attacker/target role IDs and weapon
window.play3DEffect = function(attackerId, targetId, weapon, isFumble) {
  if (!initialized || !weapon) return;
  if (isFumble) {
    // Sparks at attacker position
    spawnSparks(getUnitWorldPos(attackerId, 2), 0xffaa00);
    return;
  }

  const from = getUnitWorldPos(attackerId, 2);
  const to   = getUnitWorldPos(targetId, 2);
  if (!from || !to) return;

  const type = weapon.t; // ENERGY, BALLISTIK, SPRENGST, MELEE, DEFENS
  const name = (weapon.nm || weapon.n || '').toLowerCase();

  // Decide effect by weapon type and name
  if (name.includes('rakete') || name.includes('mörser') || name.includes('mortar')) {
    // Multiple small rockets
    const count = name.includes('doppel') || name.includes('twin') ? 5 : 4;
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnRocket(from, to), i * 90);
    }
  } else if (name.includes('flammen') || name.includes('flame')) {
    spawnFlame(from, to);
  } else if (name.includes('hammer')) {
    spawnHammerSlam(from, to);
  } else if (name.includes('faust') || name.includes('fist') || name.includes('tentakel')) {
    spawnMeleeImpact(from, to);
  } else if (name.includes('sonic') || name.includes('schall')) {
    spawnSonicWave(from, to);
  } else if (type === 'ENERGY') {
    if (name.includes('multi') || name.includes('gatling')) {
      // Multi-beams
      for (let i = 0; i < 4; i++) {
        setTimeout(() => spawnBeam(from, to, 0x00ffff, 0.06), i * 80);
      }
    } else {
      // Single beam laser
      spawnBeam(from, to, 0xff3030, 0.12);
    }
  } else if (type === 'BALLISTIK') {
    // Multiple bullets / tracer rounds
    const count = name.includes('gatling') ? 8 : name.includes('doppel') || name.includes('multi') ? 6 : 3;
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnBullet(from, to), i * 60);
    }
  } else if (type === 'SPRENGST') {
    for (let i = 0; i < 4; i++) {
      setTimeout(() => spawnRocket(from, to), i * 100);
    }
  } else {
    // Generic flash
    spawnBeam(from, to, 0xffcc00, 0.1);
  }

  // Impact effect at target after a small delay
  setTimeout(() => spawnImpact(to, type), 400);
};

// ── Effect builders ──

function spawnBeam(from, to, color, thickness) {
  // Cylinder between two points
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(thickness, thickness, len, 8);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.85
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Position at midpoint, rotated to align
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.lookAt(to);
  mesh.rotateX(Math.PI / 2);
  scene.add(mesh);

  // Outer glow
  const gGeo = new THREE.CylinderGeometry(thickness * 2.5, thickness * 2.5, len, 8);
  const gMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25 });
  const glow = new THREE.Mesh(gGeo, gMat);
  glow.position.copy(mid);
  glow.lookAt(to);
  glow.rotateX(Math.PI / 2);
  scene.add(glow);

  const expireAt = Date.now() + 350;
  activeEffects.push({
    mesh, glow,
    update: (t) => {
      const left = (expireAt - t) / 350;
      mat.opacity = Math.max(0, left * 0.85);
      gMat.opacity = Math.max(0, left * 0.25);
    },
    expireAt
  });
}

function spawnBullet(from, to) {
  const geo = new THREE.SphereGeometry(0.12, 6, 6);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffee88 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(from);
  scene.add(mesh);

  // Tracer trail
  const trailGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 6);
  const trailMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.6 });
  const trail = new THREE.Mesh(trailGeo, trailMat);
  scene.add(trail);

  const start = Date.now();
  const duration = 250 + Math.random() * 80;
  const expireAt = start + duration;
  activeEffects.push({
    mesh, trail,
    update: (t) => {
      const p = Math.min(1, (t - start) / duration);
      mesh.position.lerpVectors(from, to, p);
      trail.position.lerpVectors(from, to, Math.max(0, p - 0.1));
      trail.lookAt(mesh.position);
      trail.rotateX(Math.PI / 2);
    },
    expireAt
  });
}

function spawnRocket(from, to) {
  const grp = new THREE.Group();
  // Rocket body
  const bodyGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.5, 6);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x444444, emissive: 0x110000 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  grp.add(body);

  // Flame trail
  const flameGeo = new THREE.ConeGeometry(0.15, 0.6, 6);
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 });
  const flame = new THREE.Mesh(flameGeo, flameMat);
  flame.position.y = -0.5;
  flame.rotation.x = Math.PI;
  grp.add(flame);

  // Random offset for spread
  const offset = new THREE.Vector3(
    (Math.random() - 0.5) * 1.2, 0, (Math.random() - 0.5) * 1.2
  );
  const adjustedTo = to.clone().add(offset);

  grp.position.copy(from);
  scene.add(grp);

  const start = Date.now();
  const duration = 500 + Math.random() * 200;
  const expireAt = start + duration;

  // Arc — curve through midpoint with height
  const mid = new THREE.Vector3().addVectors(from, adjustedTo).multiplyScalar(0.5);
  mid.y += 4 + Math.random() * 2;
  const curve = new THREE.QuadraticBezierCurve3(from, mid, adjustedTo);

  activeEffects.push({
    mesh: grp,
    update: (t) => {
      const p = Math.min(1, (t - start) / duration);
      const pos = curve.getPoint(p);
      grp.position.copy(pos);
      // Aim along velocity
      if (p < 1) {
        const next = curve.getPoint(Math.min(1, p + 0.05));
        grp.lookAt(next);
        grp.rotateX(Math.PI / 2);
      }
      flameMat.opacity = 0.8 - p * 0.4;
    },
    expireAt,
    onExpire: () => {
      // Mini explosion at impact
      spawnExplosion(adjustedTo);
    }
  });
}

function spawnExplosion(pos) {
  const geo = new THREE.SphereGeometry(0.3, 8, 6);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);

  const start = Date.now();
  const duration = 350;
  const expireAt = start + duration;
  activeEffects.push({
    mesh,
    update: (t) => {
      const p = Math.min(1, (t - start) / duration);
      mesh.scale.setScalar(1 + p * 4);
      mat.opacity = 1 - p;
      mat.color.setHex(p < 0.4 ? 0xffff88 : 0xff4400);
    },
    expireAt
  });
}

function spawnSparks(pos, color) {
  if (!pos) return;
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.SphereGeometry(0.08, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    scene.add(mesh);

    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 2, Math.random() * 1.5, (Math.random() - 0.5) * 2
    );
    const start = Date.now();
    const duration = 400;
    const expireAt = start + duration;
    activeEffects.push({
      mesh,
      update: (t) => {
        const p = Math.min(1, (t - start) / duration);
        mesh.position.copy(pos).add(dir.clone().multiplyScalar(p * 2));
        mesh.position.y -= p * p * 1.5;
        mat.opacity = 1 - p;
      },
      expireAt
    });
  }
}

function spawnFlame(from, to) {
  // Cone-like flame stream
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.ConeGeometry(1.2, len, 12, 1, true);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xff5500, transparent: true, opacity: 0.7, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(from).lerp(to, 0.5);
  mesh.lookAt(to);
  mesh.rotateX(Math.PI / 2);
  scene.add(mesh);

  // Inner brighter cone
  const innerGeo = new THREE.ConeGeometry(0.5, len, 8, 1, true);
  const innerMat = new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
  const inner = new THREE.Mesh(innerGeo, innerMat);
  inner.position.copy(mesh.position);
  inner.rotation.copy(mesh.rotation);
  scene.add(inner);

  const start = Date.now();
  const duration = 700;
  const expireAt = start + duration;
  activeEffects.push({
    mesh, inner,
    update: (t) => {
      const p = (t - start) / duration;
      mat.opacity = Math.max(0, 0.7 - p * 0.7);
      innerMat.opacity = Math.max(0, 0.6 - p * 0.6);
      // Flicker
      mesh.scale.x = 1 + Math.sin(t * 0.05) * 0.15;
      mesh.scale.z = 1 + Math.cos(t * 0.04) * 0.15;
    },
    expireAt
  });
}

function spawnHammerSlam(from, to) {
  // Quick projectile + big impact
  spawnRocket(from, to);
  setTimeout(() => {
    // Shockwave ring at target
    const geo = new THREE.RingGeometry(0.2, 0.4, 24);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.copy(to);
    mesh.position.y = 0.1;
    scene.add(mesh);

    const start = Date.now();
    const duration = 500;
    const expireAt = start + duration;
    activeEffects.push({
      mesh,
      update: (t) => {
        const p = (t - start) / duration;
        mesh.scale.setScalar(1 + p * 8);
        mat.opacity = Math.max(0, 0.9 - p);
      },
      expireAt
    });
  }, 450);
}

function spawnMeleeImpact(from, to) {
  // Quick streak from attacker towards target then impact
  spawnBeam(from, to, 0xffffff, 0.15);
  setTimeout(() => spawnSparks(to, 0xffcc44), 200);
}

function spawnSonicWave(from, to) {
  // Expanding cyan ring from attacker
  const geo = new THREE.RingGeometry(0.5, 0.8, 32);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ddff, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.copy(from);
  mesh.position.y = 0.5;
  scene.add(mesh);

  const start = Date.now();
  const duration = 700;
  const expireAt = start + duration;
  activeEffects.push({
    mesh,
    update: (t) => {
      const p = (t - start) / duration;
      mesh.scale.setScalar(1 + p * 12);
      mat.opacity = Math.max(0, 0.8 - p);
    },
    expireAt
  });
}

function spawnImpact(pos, type) {
  // Color by damage type
  const colorMap = {
    ENERGY: 0xff3030, BALLISTIK: 0xffaa00,
    SPRENGST: 0xff6600, MELEE: 0xffffff, DEFENS: 0x00ddff,
  };
  const color = colorMap[type] || 0xffcc00;
  spawnSparks(pos, color);
}

// Effect cleanup happens in animate() — see hook below
function updateEffects() {
  const now = Date.now();
  for (let i = activeEffects.length - 1; i >= 0; i--) {
    const e = activeEffects[i];
    if (e.update) e.update(now);
    if (now >= e.expireAt) {
      // Run onExpire callback if present (e.g. for explosions on rocket impact)
      if (e.onExpire) e.onExpire();
      // Remove from scene
      if (e.mesh) {
        scene.remove(e.mesh);
        if (e.mesh.geometry) e.mesh.geometry.dispose();
        if (e.mesh.material) e.mesh.material.dispose();
      }
      if (e.glow) { scene.remove(e.glow); e.glow.geometry?.dispose(); e.glow.material?.dispose(); }
      if (e.inner) { scene.remove(e.inner); e.inner.geometry?.dispose(); e.inner.material?.dispose(); }
      if (e.trail) { scene.remove(e.trail); e.trail.geometry?.dispose(); e.trail.material?.dispose(); }
      activeEffects.splice(i, 1);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (!renderer) return;

  controls?.update();

  // Update weapon effects each frame
  updateEffects();


  // Hover animation on kaiju placeholder ONLY — reset group Y when model loads
  const km = unitMeshes['monster'];
  if (km?.tmp && !km.model) {
    km.tmp.position.y = 2 + Math.sin(Date.now() * 0.002) * 0.3;
    km.tmp.rotation.y += 0.003;
  } else if (km?.mesh && km.model) {
    km.mesh.position.y = 0; // ensure group is on ground once model loaded
  }

  // Gentle glow pulse on all units
  Object.values(unitMeshes).forEach(u => {
    if (u.glow) {
      u.glow.material.opacity = 0.12 + Math.sin(Date.now() * 0.003) * 0.06;
    }
  });

  renderer.render(scene, camera);
}

// Hook into the global render cycle
const _origRender = window.render;
window.render = function() {
  _origRender?.();
  // Init 3D when combat screen first appears
  if (document.getElementById('SC')?.classList.contains('on')) {
    if (!initialized) {
      setTimeout(() => { init3D(); update3DPositions(); }, 100);
    } else {
      update3DPositions();
    }
  }
};

// Also hook into goCombat
const _origGoCombat = window.goCombat;
window.goCombat = function() {
  _origGoCombat?.();
  setTimeout(() => { init3D(); update3DPositions(); }, 200);
};
