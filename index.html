<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KAIJU SKIRMISH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.162.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.162.0/examples/jsm/"
}}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#04060a;--p:#080c14;--p2:#0c1220;--b:#162030;--bh:#1e3050;
  --t:#7a9ab8;--th:#b8d4f0;--dm:#344a60;--cy:#00c8f0;--rd:#f03040;--gr:#00e080;--yl:#f0c000;--pu:#a040f0;
  --fh:'Orbitron',monospace;--fm:'Share Tech Mono',monospace;--fb:'Exo 2',sans-serif}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t);font-family:var(--fb);overflow:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,200,240,.01) 3px,rgba(0,200,240,.01) 4px)}
.S{display:none;position:fixed;inset:0;flex-direction:column;overflow:hidden}.S.on{display:flex}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--p)}
.logo{font-family:var(--fh);font-weight:900;font-size:.8rem;letter-spacing:.18em;color:var(--cy);text-shadow:0 0 16px rgba(0,200,240,.3)}
.ti{font-family:var(--fm);font-size:.55rem;color:var(--dm);letter-spacing:.1em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rd);box-shadow:0 0 6px var(--rd);animation:bl 1.8s infinite}
.dot.ok{background:var(--gr);box-shadow:0 0 6px var(--gr);animation:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}

.btn{font-family:var(--fh);font-size:.6rem;letter-spacing:.08em;padding:10px 18px;cursor:pointer;
  border:1px solid var(--bh);background:transparent;color:var(--th);transition:all .14s;
  }
.btn:hover{border-color:var(--cy);color:var(--cy)}.btn:active{transform:scale(.97)}
.btn.c{border-color:var(--cy);color:var(--cy)}.btn.g{border-color:var(--gr);color:var(--gr)}
.btn.r{border-color:var(--rd);color:var(--rd)}.btn.gh{border-color:var(--b);color:var(--dm)}

.inp{font-family:var(--fm);font-size:.9rem;letter-spacing:.14em;padding:10px 12px;
  background:var(--p2);border:1px solid var(--bh);color:var(--th);outline:none;width:100%}
.inp:focus{border-color:var(--cy)}
.lb{font-family:var(--fh);font-size:.44rem;letter-spacing:.18em;color:var(--dm);margin-bottom:4px}

.hpt{height:6px;background:var(--p2);border:1px solid var(--b)}
.hpf{height:100%;background:var(--gr);transition:width .35s,background .35s}
.hpf.w{background:var(--yl)}.hpf.cr{background:var(--rd)}
.hptx{font-family:var(--fm);font-size:.52rem;color:var(--dm);text-align:right;margin-top:2px}

.chip{font-family:var(--fm);font-size:.44rem;padding:1px 4px;border:1px solid var(--dm);color:var(--dm);display:inline-block;margin:1px}
.chip.bad{border-color:var(--rd);color:var(--rd)}.chip.good{border-color:var(--gr);color:var(--gr)}

.sl{font-family:var(--fh);font-size:.43rem;letter-spacing:.18em;color:var(--dm);padding-bottom:4px;border-bottom:1px solid var(--b);margin-bottom:7px}
.log{flex:1;min-height:0;overflow-y:auto;padding:5px 8px;font-family:var(--fm);font-size:.6rem;line-height:1.7}
.lr{display:flex;gap:5px}.lr .ts{color:var(--dm);flex-shrink:0}
.lr.sys .m{color:var(--cy)}.lr.dmg .m{color:var(--rd)}.lr.roll .m{color:var(--yl)}.lr.phase .m{color:var(--pu);font-weight:bold}

.dc{width:52px;height:52px;border:2px solid var(--bh);background:var(--p2);color:var(--th);
  font-family:var(--fh);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.dc:hover{border-color:var(--yl);color:var(--yl)}.dc.used{border-color:var(--dm);color:var(--dm);pointer-events:none}
.dc.shake{animation:dsh .4s ease}
@keyframes dsh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.br{font-family:var(--fh);font-weight:900;font-size:2.2rem;text-align:center;color:var(--yl);text-shadow:0 0 16px rgba(240,192,0,.5);min-height:2.6rem}
.br.crit{color:var(--gr);text-shadow:0 0 16px rgba(0,224,128,.6)}.br.fumb{color:var(--rd);text-shadow:0 0 16px rgba(240,48,64,.6)}

.ec{padding:8px 10px;border:1px solid var(--b);background:var(--p2);position:relative;margin-bottom:5px}
.ec.mine{border-color:var(--cy)}.ec.kai{border-color:rgba(240,48,64,.4)}
.ec.turn::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
.ec.kai.turn::before{background:linear-gradient(90deg,transparent,var(--rd),transparent)}
.en{font-family:var(--fh);font-size:.68rem;letter-spacing:.1em;color:var(--th);margin-bottom:2px}
.et{font-family:var(--fm);font-size:.56rem;color:var(--dm);margin-bottom:4px}

.pb{display:flex;gap:3px;padding:4px 10px;border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.ps{font-family:var(--fh);font-size:.46rem;letter-spacing:.06em;padding:4px 10px;border:1px solid var(--b);color:var(--dm);white-space:nowrap;flex-shrink:0;
  }
.ps.dn{border-color:var(--bh);color:var(--bh)}.ps.ac{border-color:var(--cy);color:var(--cy);background:rgba(0,200,240,.06)}

.tb{text-align:center;padding:5px;font-family:var(--fh);font-size:.53rem;letter-spacing:.1em;border-bottom:1px solid var(--b);flex-shrink:0}
.tb.my{color:var(--cy);background:rgba(0,200,240,.05)}.tb.wt{color:var(--dm)}.tb.mk{color:var(--rd);background:rgba(240,48,64,.05)}

.modal{display:none;position:fixed;inset:0;background:rgba(4,6,10,.88);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mx{width:min(360px,92vw);background:var(--p);border:1px solid var(--bh);padding:18px}
.mt{font-family:var(--fh);font-size:.68rem;letter-spacing:.15em;color:var(--cy);margin-bottom:12px}

.wo{padding:10px 12px;border:1px solid var(--b);cursor:pointer;transition:all .14s;display:flex;gap:10px;align-items:center;margin-bottom:5px}
.wo:hover{border-color:var(--bh)}.wo.sel{border-color:var(--cy);background:rgba(0,200,240,.04)}
.wn{font-family:var(--fh);font-size:.62rem;letter-spacing:.07em;color:var(--th)}
.ws{font-family:var(--fm);font-size:.56rem;color:var(--dm)}
.wbd{font-family:var(--fm);font-size:.42rem;padding:1px 4px;border:1px solid var(--bh);color:var(--dm);flex-shrink:0}

.ab{padding:10px 12px;border:1px solid var(--b);background:transparent;color:var(--t);font-family:var(--fm);font-size:.62rem;
  cursor:pointer;width:100%;text-align:left;margin-bottom:3px;transition:all .14s}
.ab:hover{border-color:var(--rd);color:var(--rd)}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bh)}

/* ══ SCREENS ══ */
#SL{background:radial-gradient(ellipse 70% 50% at 50% 110%,rgba(0,200,240,.04),transparent),var(--bg);
  align-items:center;justify-content:center;overflow-y:auto}
.lw{width:min(390px,92vw);display:flex;flex-direction:column;gap:13px;padding:20px 0}
.lh h1{font-family:var(--fh);font-weight:900;font-size:clamp(1.8rem,7vw,2.7rem);letter-spacing:.25em;
  color:var(--cy);text-shadow:0 0 32px rgba(0,200,240,.3);line-height:1.1;text-align:center}
.lh p{font-family:var(--fm);font-size:.54rem;letter-spacing:.2em;color:var(--dm);margin-top:5px;text-align:center}
.dv{height:1px;background:linear-gradient(90deg,transparent,var(--bh),transparent)}
.lp{padding:14px;border:1px solid var(--b);background:var(--p);display:flex;flex-direction:column;gap:10px}
.err{font-family:var(--fm);font-size:.52rem;color:var(--rd);min-height:1em}
.hn{font-family:var(--fm);font-size:.52rem;color:var(--dm);line-height:1.8;text-align:center}
.cs{font-family:var(--fm);font-size:.58rem;color:var(--dm);text-align:center;min-height:1.5em}

#SR{background:var(--bg)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:9px;flex:1;min-height:0;overflow-y:auto}
.rc{border:1px solid var(--b);background:var(--p2);padding:10px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:4px}
.rc:hover{border-color:var(--bh)}.rc.sel{border-color:var(--cy);background:rgba(0,200,240,.05)}
.rc.kc{border-color:rgba(240,48,64,.3)}.rc.kc.sel{border-color:var(--rd);background:rgba(240,48,64,.05)}
.rc.taken{opacity:.3;pointer-events:none}
.rn{font-family:var(--fh);font-size:.58rem;letter-spacing:.1em;color:var(--th)}
.rd{font-size:.54rem;color:var(--dm);line-height:1.4}
.rf{flex-shrink:0;padding:9px 13px;border-top:1px solid var(--b);background:var(--p);display:flex;align-items:center;justify-content:space-between;gap:9px}

#SC{background:var(--bg)}
.cb{flex:1;min-height:0;display:grid;grid-template-columns:1fr 260px;grid-template-rows:1fr;overflow:hidden}
.cb-3d{position:relative;overflow:hidden;background:#020408;border-right:1px solid var(--b)}
.cb-3d canvas{display:block;width:100%;height:100%}
.cb-3d-overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;
  background:linear-gradient(transparent,rgba(4,6,10,.85));pointer-events:none;
  font-family:var(--fm);font-size:.54rem;color:var(--dm);display:flex;flex-wrap:wrap;gap:6px}
.cb-3d-overlay .dist-tag{color:var(--yl);pointer-events:auto;cursor:default}
.cb-side{display:flex;flex-direction:column;overflow:hidden}
.cb-ents{flex-shrink:0;max-height:200px;overflow-y:auto;padding:5px;border-bottom:1px solid var(--b)}
.cbt{padding:8px;overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:7px}
.cbb{display:flex;flex-direction:column;overflow:hidden;max-height:150px;min-height:100px}
.cbbh{flex-shrink:0;padding:3px 7px;border-bottom:1px solid var(--b)}
@media(max-width:600px){.cb{grid-template-columns:1fr;grid-template-rows:45vh 1fr}
  .cb-side{overflow-y:auto}.cb-ents{max-height:80px}}

/* Init tracker */
.it{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.itc{padding:6px 10px;border:1px solid var(--b);background:var(--p2);font-family:var(--fm);font-size:.58rem;color:var(--dm);min-width:100px;transition:all .2s}
.itc.done{border-color:var(--gr);color:var(--gr)}.itc.wait{border-color:var(--yl);color:var(--yl)}
.itc .iv{font-family:var(--fh);font-size:1rem;font-weight:700;margin-top:3px}

/* Turn order bar */
.tob{display:flex;gap:4px;padding:4px 10px;border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tos{font-family:var(--fm);font-size:.54rem;padding:4px 10px;border:1px solid var(--b);color:var(--dm);white-space:nowrap}
.tos.active{border-color:var(--cy);color:var(--cy);background:rgba(0,200,240,.06)}
.tos.kai-active{border-color:var(--rd);color:var(--rd);background:rgba(240,48,64,.06)}
.tos.done{color:var(--bh);border-color:var(--bh)}
</style>
</head>
<body>

<div id="SL" class="S on">
  <div class="lw">
    <div class="lh"><h1>KAIJU<br>SKIRMISH</h1><p>TACTICAL COMBAT · v0.4</p></div>
    <div class="dv"></div>
    <div class="lp">
      <div><div class="lb">RAUM-CODE (4+ Zeichen)</div>
        <input class="inp" id="lc" maxlength="8" placeholder="Z.B.  ALPHA1" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="err" id="le"></div>
      <div class="cs" id="cs"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
        <button class="btn c" onclick="doHost()">+ HOSTEN</button>
        <button class="btn" onclick="doJoin()">→ BEITRETEN</button>
      </div>
    </div>
    <p class="hn">Host erstellt Raum. Gäste treten mit Code bei.<br>Funktioniert über WLAN zwischen Geräten.</p>
  </div>
</div>

<div id="SR" class="S">
  <div class="top">
    <span class="logo" style="font-size:.68rem">KAIJU SKIRMISH</span>
    <span class="ti" id="rr">RAUM: ——</span>
    <div style="display:flex;align-items:center;gap:7px"><div class="dot ok" id="rdot"></div><span class="ti" id="rcn">0</span></div>
  </div>
  <div style="padding:6px 10px 2px;flex-shrink:0"><div class="sl" style="margin:0">ROLLE WÄHLEN</div></div>
  <div class="rg" id="rg"></div>
  <div class="rf">
    <button class="btn r" onclick="doLeave()" style="padding:6px 11px">← ZURÜCK</button>
    <span class="err" id="re" style="flex:1"></span>
    <button class="btn gh" id="brdy" onclick="doReady()">BEREIT →</button>
  </div>
</div>

<div id="SC" class="S">
  <div class="top">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="logo" id="cn" style="font-size:.68rem">—</span>
      <span class="ti" id="cu">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <div class="dot ok"></div>
      <span class="ti" id="cr">RUNDE 1</span>
      <button class="btn" style="padding:3px 7px;font-size:.44rem" onclick="openM('mm')">☰</button>
    </div>
  </div>
  <div class="tb wt" id="tbn">—</div>
  <div class="tob" id="tob"></div>
  <div class="pb" id="ppb"></div>
  <div class="cb">
    <div class="cb-3d" id="viewport3d">
      <div class="cb-3d-overlay" id="dist-overlay"></div>
    </div>
    <div class="cb-side">
      <div class="cb-ents">
        <div style="padding:3px 5px;border-bottom:1px solid var(--b)"><div class="sl" style="margin:0">EINHEITEN</div></div>
        <div id="el" style="padding:4px"></div>
      </div>
      <div class="cbt" id="ca"></div>
      <div class="cbb">
        <div class="cbbh"><div class="sl" style="margin:0">KAMPFLOG</div></div>
        <div class="log" id="cl"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="mm"><div class="mx"><div class="mt">MENÜ</div>
  <div style="display:flex;flex-direction:column;gap:7px">
    <button class="btn c" style="width:100%" onclick="closeM('mm')">FORTSETZEN</button>
    <button class="btn r" style="width:100%" onclick="doLeave()">VERLASSEN</button>
  </div></div></div>

<div class="modal" id="md"><div class="mx"><div class="mt">SCHADEN ANWENDEN</div>
  <div class="ti" id="mdt" style="margin-bottom:6px;color:var(--t)">Ziel: —</div>
  <div style="text-align:center;margin:10px 0">
    <div class="lb" style="text-align:center">GEWÜRFELTER SCHADEN</div>
    <div id="mdroll" style="font-family:var(--fh);font-weight:900;font-size:2rem;color:var(--yl);text-shadow:0 0 14px rgba(240,192,0,.4);margin:4px 0">0</div>
    <div id="mdarm" style="font-family:var(--fm);font-size:.56rem;color:var(--dm);margin-bottom:4px"></div>
    <div id="mdfinal" style="font-family:var(--fh);font-size:1rem;color:var(--rd)"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
    <button class="btn r" style="padding:12px 16px" onclick="doDmg()">ANWENDEN</button>
    <button class="btn" onclick="closeM('md')">ABBRUCH</button>
  </div>
  <input type="hidden" id="mdv" value="0">
</div></div>

<script>
'use strict';
/*═══════════════════════════════════════════════════════════════
  KAIJU SKIRMISH v0.4  —  PeerJS + Turn Order via Initiative
  
  FLOW:
  1. All players ready up → combat starts
  2. INITIATIVE: everyone rolls W20 simultaneously
  3. Host collects all rolls, sorts desc → turnOrder[]
  4. First in turnOrder gets their turn:
     WAFFE → ZIEL → ANGRIFF → SCHADEN → done
  5. Next player gets their turn, etc.
  6. After last player: RUNDE ENDE
  7. Monster controller starts next round
  
  HOST is authoritative. G = shared state.
  All actions go through toHost() → host applies → broadcasts.
═══════════════════════════════════════════════════════════════*/

// ── DATA ──────────────────────────────────────────────────────
const MECHS=[
  {id:'p1',nm:'IRON WARDEN',tp:'Heavy Assault',hp:120,ar:4,spd:2,weps:['railgun','scatter','punch'],sp:'Fortress Mode: +3 ARM 1R'},
  {id:'p2',nm:'SPECTRE-9',tp:'Recon/Strike',hp:80,ar:2,spd:5,weps:['twin_smg','blade','emp'],sp:'Ghost Protocol: unsichtbar 1R'},
  {id:'p3',nm:'COLOSSUS-X',tp:'Artillery',hp:100,ar:3,spd:2,weps:['mortar','flak','kick'],sp:'Orbital Beacon: +2W6 nächster Angriff'},
  {id:'p4',nm:'VIPER UNIT',tp:'Skirmisher',hp:90,ar:2,spd:4,weps:['plasma','ripper','smoke'],sp:'Overdrive: 2 Angriffe/R'},
];
const KAIJU=[
  {id:'k1',nm:'GORGOTHON',tp:'Titan',hp:300,ar:6,ab:['Stampede (2W10 nah)','Strahlenatem (4W10 Linie)','Schwanzpeitsche (AoE)','Berserker (+2 Schaden/R)'],sp:'Strahlenatem: 4W10'},
  {id:'k2',nm:'VEXAR PRIME',tp:'Psionics',hp:220,ar:4,ab:['Mind Shatter','Phase Shift','Psi-Burst (2W8 AoE)','Absorption (W6 HP)'],sp:'Mind Shatter'},
  {id:'k3',nm:'HYDRAGORE',tp:'Multi',hp:260,ar:5,ab:['Dreifach-Biss (3×2W8)','Regeneration (10HP/R)','Säurespucke (2W6+bleed)','Wickelgriff'],sp:'Regen 10HP/R'},
];
const WEPS={
  railgun:{n:'Railgun',d:'2W8',t:'ENERGY',r:'LANG',x:''},scatter:{n:'Streukanone',d:'3W4',t:'BALL.',r:'MITTEL',x:''},
  punch:{n:'Faust',d:'1W10+4',t:'MELEE',r:'NAH',x:''},twin_smg:{n:'Dual-SMG',d:'2W6',t:'BALL.',r:'KURZ',x:''},
  blade:{n:'Monoklinge',d:'2W8',t:'MELEE',r:'NAH',x:'Ign.2 ARM'},emp:{n:'EMP',d:'1W6',t:'SPRENG',r:'MITTEL',x:'STUN 1R'},
  mortar:{n:'Siegemörser',d:'3W6',t:'SPRENG',r:'LANG',x:'Splash'},flak:{n:'Flak Array',d:'2W4',t:'BALL.',r:'MITTEL',x:'AoE'},
  kick:{n:'Stampfattacke',d:'2W6+3',t:'MELEE',r:'NAH',x:'Push'},plasma:{n:'Plasmaknute',d:'1W8+2',t:'ENERGY',r:'KURZ',x:'Bleed'},
  ripper:{n:'Ripper',d:'2W6',t:'MELEE',r:'NAH',x:'Krit 5+'},smoke:{n:'Rauchgranate',d:'0',t:'UTIL',r:'MITTEL',x:'Cover'},
};
const FL={STUNNED:'bad',BERSERK:'bad',BLEEDING:'bad',COVER:'good',REGEN:'good',INVIS:'good'};
const RDEFS=[
  {id:'p1',nm:'SPIELER 1',ic:'🤖',m:MECHS[0]},{id:'p2',nm:'SPIELER 2',ic:'🦾',m:MECHS[1]},
  {id:'p3',nm:'SPIELER 3',ic:'⚙️',m:MECHS[2]},{id:'p4',nm:'SPIELER 4',ic:'🔩',m:MECHS[3]},
  {id:'monster',nm:'MONSTER',ic:'👾',m:null,isK:true},
];

/*
  GAME STATE (G) — authoritative on host, synced to all
  
  G.state: 'LOBBY' | 'INIT_ROLL' | 'TURNS' | 'ROUND_END'
  G.round: current round number
  G.roles: { roleId: peerId }
  G.ents:  { roleId: entity }
  G.log:   [ {type, msg, ts} ]
  
  Initiative phase:
  G.initRolls: { roleId: number|null }  — null = hasn't rolled yet
  G.turnOrder: [ roleId, roleId, ... ]  — sorted by init desc
  G.turnIdx:   index into turnOrder for whose turn it is
  
  Active turn:
  G.turnPhase: 'WAFFE'|'ZIEL'|'ANGRIFF'|'SCHADEN'|'DONE'
*/

const ME={id:rnd(),room:'',role:null,mech:null,kaiju:null,isHost:false};
window.ME=ME;
let T={wep:null,tgt:null,atk:null,dmg:null}; // local scratch per turn

let G={state:'LOBBY',round:1,roles:{},ents:{},log:[],
  initRolls:{},turnOrder:[],turnIdx:0,turnPhase:'WAFFE'};
// Expose G to module scope via window — updated on every reassignment
Object.defineProperty(window,'G',{get(){return G;},set(v){G=v;}});

// ── PEERJS ────────────────────────────────────────────────────
let peer=null, conns=[];

function stat(t,ok){const e=document.getElementById('cs');if(e){e.textContent=t;e.style.color=ok?'var(--gr)':'var(--dm)';}}

function doHost(){
  const code=document.getElementById('lc').value.trim().toUpperCase();
  const err=document.getElementById('le');
  if(code.length<4){err.textContent='Min. 4 Zeichen.';return;}
  err.textContent='';ME.room=code;ME.isHost=true;
  G={state:'LOBBY',round:1,roles:{},ents:{},log:[],initRolls:{},turnOrder:[],turnIdx:0,turnPhase:'WAFFE'};
  stat('Verbinde…');
  peer=new Peer('ks_'+code,{debug:0});
  peer.on('open',()=>{stat('Raum aktiv: '+code,true);peer.on('connection',c=>hAccept(c));goRoles();});
  peer.on('error',e=>{
    if(e.type==='unavailable-id')err.textContent='Code belegt.';
    else err.textContent='Fehler: '+e.type;
    if(peer){peer.destroy();peer=null;}
  });
}

function doJoin(){
  const code=document.getElementById('lc').value.trim().toUpperCase();
  const err=document.getElementById('le');
  if(code.length<4){err.textContent='Min. 4 Zeichen.';return;}
  err.textContent='';ME.room=code;ME.isHost=false;
  stat('Verbinde…');
  peer=new Peer(undefined,{debug:0});
  peer.on('open',()=>{
    const c=peer.connect('ks_'+code,{reliable:true});
    c.on('open',()=>{conns=[c];stat('Verbunden: '+code,true);goRoles();});
    c.on('data',d=>gRecv(d));
    c.on('close',()=>{stat('Verbindung verloren.');conns=[];});
    c.on('error',e=>err.textContent='Fehler: '+e);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable')err.textContent='Raum "'+code+'" nicht gefunden.';
    else err.textContent='Fehler: '+e.type;
    if(peer){peer.destroy();peer=null;}
  });
}

function hAccept(c){
  conns.push(c);
  c.on('open',()=>{c.send({t:'FULL',G});updCnt();});
  c.on('data',d=>hRecv(d,c));
  c.on('close',()=>{conns=conns.filter(x=>x!==c);updCnt();});
}

// HOST receives action from guest
function hRecv(msg){
  if(msg.t==='ROLE'){
    Object.keys(G.roles).forEach(k=>{if(G.roles[k]===msg.pid)delete G.roles[k];});
    if(msg.rid) G.roles[msg.rid]=msg.pid;
    hBroadcast();
  }
  if(msg.t==='ENT'){G.ents[msg.id]=msg.e;hBroadcast();}
  if(msg.t==='LOG'){
    // Avoid duplicates (sender already added locally)
    const dominated=G.log.some(l=>l.ts===msg.e.ts&&l.msg===msg.e.msg);
    if(!dominated)G.log.push(msg.e);
    hBroadcast();
  }
  if(msg.t==='INIT_ROLL'){
    G.initRolls[msg.role]=msg.val;
    hBroadcast();
    // Check if all rolled
    hCheckInitDone();
  }
  if(msg.t==='SET_TURN_PHASE'){G.turnPhase=msg.p;hBroadcast();}
  if(msg.t==='NEXT_TURN'){hNextTurn();hBroadcast();}
  if(msg.t==='DMG'){
    const e=G.ents[msg.tgt];
    if(e){const red=Math.max(0,msg.raw-(e.ar||0));e.hp=Math.max(0,e.hp-red);}
    hBroadcast();
  }
  if(msg.t==='START_ROUND'){
    G.round=msg.round;G.state='INIT_ROLL';
    G.initRolls={};G.turnOrder=[];G.turnIdx=0;G.turnPhase='WAFFE';
    // Init rolls for all active entities
    Object.keys(G.ents).forEach(k=>{if(G.ents[k].hp>0)G.initRolls[k]=null;});
    hBroadcast();
  }
  if(msg.t==='ALL_READY'){
    // Start first round
    G.state='INIT_ROLL';
    G.initRolls={};G.turnOrder=[];G.turnIdx=0;G.turnPhase='WAFFE';
    Object.keys(G.ents).forEach(k=>{if(G.ents[k].hp>0)G.initRolls[k]=null;});
    hBroadcast();
  }
}

function hCheckInitDone(){
  const rolls=G.initRolls;
  const allDone=Object.values(rolls).every(v=>v!==null);
  if(!allDone) return;
  // Sort by roll desc
  const order=Object.keys(rolls).sort((a,b)=>rolls[b]-rolls[a]);
  G.turnOrder=order;
  G.turnIdx=0;
  G.turnPhase='WAFFE';
  G.state='TURNS';
  hBroadcast();
}

function hNextTurn(){
  G.turnIdx++;
  if(G.turnIdx>=G.turnOrder.length){
    G.state='ROUND_END';
  } else {
    G.turnPhase='WAFFE';
  }
}

function hBroadcast(){
  const p={t:'FULL',G};
  conns.forEach(c=>{try{c.send(p);}catch(e){}});
  render(); // local render on host
}

// GUEST receives full state from host
function gRecv(msg){
  if(msg.t==='FULL'){G=msg.G;render();if(document.getElementById('SR').classList.contains('on'))renRoles();}
}

// Send to host (or process locally if we ARE host)
function toH(msg){
  if(ME.isHost)hRecv(msg); else if(conns[0])conns[0].send(msg);
}

function updCnt(){
  const n=ME.isHost?conns.length+1:1;
  const el=document.getElementById('rcn');if(el)el.textContent=n+' Spieler';
}

// ── LEAVE ─────────────────────────────────────────────────────
function doLeave(){
  if(ME.role){toH({t:'ROLE',pid:ME.id,rid:null});}
  ME.role=null;ME.mech=null;ME.kaiju=null;ME.room='';ME.isHost=false;
  conns.forEach(c=>{try{c.close();}catch(e){}});conns=[];
  if(peer){peer.destroy();peer=null;}
  go('SL');closeM('mm');
}

// ── ROLES ─────────────────────────────────────────────────────
function goRoles(){
  document.getElementById('rr').textContent='RAUM: '+ME.room;
  ME.role=null;renRoles();go('SR');
}

function renRoles(){
  const g=document.getElementById('rg');g.innerHTML='';
  const cnt=Object.keys(G.roles).length;
  document.getElementById('rcn').textContent=cnt+' Spieler';

  RDEFS.forEach(rd=>{
    const tb=G.roles[rd.id],im=tb===ME.id,it=!!tb&&!im;
    const d=document.createElement('div');
    d.className='rc'+(rd.isK?' kc':'')+(im?' sel':'')+(it?' taken':'');
    let x='';
    if(rd.m)x=`<div class="rd">${rd.m.tp}</div><div class="rd" style="color:var(--dm)">HP ${rd.m.hp} · ARM ${rd.m.ar} · SPD ${rd.m.spd}</div>`;
    if(rd.isK)x=`<div class="rd">Steuert das Kaiju</div>`;
    if(it)x+=`<div style="font-family:var(--fm);font-size:.46rem;color:var(--rd)">BELEGT</div>`;
    if(im)x+=`<div style="font-family:var(--fm);font-size:.46rem;color:var(--cy)">✓ GEWÄHLT</div>`;
    d.innerHTML=`<div style="font-size:1.3rem">${rd.ic}</div><div class="rn">${rd.nm}</div>${x}`;
    if(!it)d.onclick=()=>pickRole(rd.id);
    g.appendChild(d);
  });
  document.getElementById('brdy').className=ME.role?'btn c':'btn gh';
}

function pickRole(rid){
  Object.keys(G.roles).forEach(k=>{if(G.roles[k]===ME.id)delete G.roles[k];});
  G.roles[rid]=ME.id;ME.role=rid;
  const rd=RDEFS.find(r=>r.id===rid);
  ME.mech=rd?.m||null;ME.kaiju=rd?.isK?KAIJU[0]:null;
  toH({t:'ROLE',pid:ME.id,rid});
  renRoles();
}

function doReady(){
  if(!ME.role){document.getElementById('re').textContent='Erst Rolle wählen.';return;}
  document.getElementById('re').textContent='';
  if(ME.role==='monster'){
    const k=ME.kaiju||KAIJU[0];ME.kaiju=k;
    G.ents['monster']={id:'monster',nm:k.nm,tp:k.tp,mhp:k.hp,hp:k.hp,ar:k.ar,fl:[],isK:true};
    toH({t:'ENT',id:'monster',e:G.ents['monster']});
  } else {
    const m=ME.mech;
    G.ents[ME.role]={id:ME.role,nm:m.nm,tp:m.tp,mhp:m.hp,hp:m.hp,ar:m.ar,fl:[],isK:false,weps:m.weps};
    toH({t:'ENT',id:ME.role,e:G.ents[ME.role]});
  }
  const rn=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  const un=ME.role==='monster'?ME.kaiju?.nm:ME.mech?.nm;
  addLog('sys',`${rn} bereit (${un})`);
  goCombat();
}

// ── COMBAT ────────────────────────────────────────────────────
window.goCombat=goCombat;
function goCombat(){
  const isK=ME.role==='monster';
  document.getElementById('cn').textContent=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  document.getElementById('cn').style.color=isK?'var(--rd)':'var(--cy)';
  document.getElementById('cu').textContent=isK?(ME.kaiju?.nm||''):(ME.mech?.nm||'');
  go('SC');render();
}

// ── RENDER ────────────────────────────────────────────────────
let _actLock = false; // true while dice animation is showing

window.render=render;
function render(){
  renEnts();renPhase();renTurnOrder();renTurnBanner();
  if(!_actLock) renAct(); // don't overwrite action area during dice display
  renLog();
  const cr=document.getElementById('cr');if(cr)cr.textContent='RUNDE '+G.round;
}

function lockAct(ms){
  _actLock=true;
  setTimeout(()=>{_actLock=false;renAct();},ms);
}

function renEnts(){
  const el=document.getElementById('el');if(!el)return;el.innerHTML='';
  const all=Object.values(G.ents);
  if(!all.length){el.innerHTML='<div style="font-family:var(--fm);font-size:.52rem;color:var(--dm);padding:4px">Warte auf Spieler…</div>';return;}
  const cur=G.state==='TURNS'?G.turnOrder[G.turnIdx]:null;
  all.forEach(e=>{
    const im=e.id===ME.role,it=e.id===cur;
    const pct=Math.max(0,Math.round(e.hp/e.mhp*100));
    const bc=pct>60?'':pct>30?' w':' cr';
    const fl=(e.fl||[]).map(f=>`<span class="chip ${FL[f]||''}">${f}</span>`).join('');
    const d=document.createElement('div');
    d.className='ec'+(e.isK?' kai':'')+(im?' mine':'')+(it?' turn':'');
    d.innerHTML=`<div class="en" style="${e.isK?'color:var(--rd)':''}">
      ${e.nm}${im?' <span style="font-size:.4rem;color:var(--cy)">[DU]</span>':''}${it?' <span style="font-size:.4rem;color:var(--yl)">▶</span>':''}
    </div><div class="et">${e.tp}</div>
    <div class="hpt"><div class="hpf${bc}" style="width:${pct}%"></div></div>
    <div class="hptx">${e.hp}/${e.mhp} · ARM ${e.ar}</div>
    ${fl?`<div style="margin-top:2px">${fl}</div>`:''}`;
    el.appendChild(d);
  });
}

function renPhase(){
  const b=document.getElementById('ppb');if(!b)return;
  if(G.state==='INIT_ROLL'){
    b.innerHTML='<div class="ps ac">INITIATIVE</div>';return;
  }
  if(G.state==='ROUND_END'){
    b.innerHTML='<div class="ps ac">RUNDE ENDE</div>';return;
  }
  if(G.state!=='TURNS'){b.innerHTML='';return;}
  const phases=['WAFFE','ZIEL','ANGRIFF','SCHADEN','DONE'];
  const cur=phases.indexOf(G.turnPhase);
  b.innerHTML=phases.map((p,i)=>`<div class="ps${i<cur?' dn':i===cur?' ac':''}">${p}</div>`).join('');
}

function renTurnOrder(){
  const b=document.getElementById('tob');if(!b)return;
  if(G.state!=='TURNS'&&G.state!=='ROUND_END'){b.innerHTML='';return;}
  b.innerHTML=G.turnOrder.map((rid,i)=>{
    const e=G.ents[rid];const nm=e?.nm||rid;const isK=e?.isK;
    let cls='tos';
    if(i<G.turnIdx)cls+=' done';
    else if(i===G.turnIdx)cls+=isK?' kai-active':' active';
    return`<div class="${cls}">${i+1}. ${nm} (${G.initRolls[rid]||'?'})</div>`;
  }).join('');
}

function renTurnBanner(){
  const b=document.getElementById('tbn');if(!b)return;
  if(G.state==='INIT_ROLL'){
    const allR=Object.values(G.initRolls);
    const done=allR.filter(v=>v!==null).length;
    b.className='tb wt';
    b.textContent=`INITIATIVE PHASE — ${done}/${allR.length} gewürfelt`;
    return;
  }
  if(G.state==='ROUND_END'){
    b.className='tb wt';b.textContent='RUNDE '+G.round+' ABGESCHLOSSEN';return;
  }
  if(G.state!=='TURNS'){b.className='tb wt';b.textContent='WARTE AUF SPIELER…';return;}
  const cur=G.turnOrder[G.turnIdx];
  const e=G.ents[cur];const nm=e?.nm||cur;
  const isMe=cur===ME.role;
  if(isMe){
    b.className='tb'+(ME.role==='monster'?' mk':' my');
    b.textContent='▶ DEIN ZUG — '+G.turnPhase;
  } else {
    b.className='tb wt';
    b.textContent=`WARTET: ${nm} · ${G.turnPhase}`;
  }
}

// ── ACTION AREA ───────────────────────────────────────────────
function renAct(){
  const a=document.getElementById('ca');if(!a)return;

  // INIT_ROLL: everyone sees their own dice button
  if(G.state==='INIT_ROLL'){rInit(a);return;}

  // ROUND_END: monster controller can start next round
  if(G.state==='ROUND_END'){rRndEnd(a);return;}

  // TURNS: only active player sees action UI
  if(G.state!=='TURNS'){a.innerHTML='<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);padding:8px">Warte…</div>';return;}

  const cur=G.turnOrder[G.turnIdx];
  const isMe=cur===ME.role;

  if(!isMe){
    const e=G.ents[cur];
    a.innerHTML=`<div class="sl">WARTEN</div><div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);line-height:2;padding:8px 0">
      <span style="color:var(--th)">${e?.nm||'?'}</span> ist am Zug.<br>Phase: ${G.turnPhase}</div>`;
    return;
  }

  // My turn — show appropriate phase
  const fn={WAFFE:ME.role==='monster'?rKPick:rWep,ZIEL:rTgt,ANGRIFF:rAtk,SCHADEN:rDmgP,DONE:rDone};
  if(fn[G.turnPhase])fn[G.turnPhase](a);
}

// INITIATIVE — everyone rolls simultaneously
function rInit(a){
  const myRoll=G.initRolls[ME.role];
  const hasRolled=myRoll!==null&&myRoll!==undefined;
  const allRolls=Object.entries(G.initRolls);

  a.innerHTML=`<div class="sl">INITIATIVE — ALLE WÜRFELN W20</div>
    <div style="font-family:var(--fm);font-size:.62rem;color:var(--dm);margin-bottom:10px;line-height:1.8">
      Jeder würfelt gleichzeitig. Höchstes Ergebnis beginnt.
    </div>
    ${!hasRolled?`
      <div style="display:flex;justify-content:center;margin-bottom:12px">
        <button class="dc" onclick="doInit(this)">W20</button>
      </div>
      <div class="br" id="ri"></div>
    `:`
      <div style="font-family:var(--fm);font-size:.7rem;color:var(--gr);text-align:center;margin-bottom:10px">
        ✓ Du hast ${myRoll} gewürfelt. Warte auf andere…
      </div>
    `}
    <div class="sl" style="margin-top:10px">ERGEBNISSE</div>
    <div class="it" id="itk"></div>`;

  const itk=document.getElementById('itk');
  allRolls.forEach(([rid,val])=>{
    const e=G.ents[rid];const nm=e?.nm||rid;
    const d=document.createElement('div');
    d.className='itc'+(val!==null?' done':' wait');
    d.innerHTML=`<div>${nm}</div><div class="iv">${val!==null?val:'…'}</div>`;
    itk.appendChild(d);
  });
}

function doInit(btn){
  const n=roll(20);
  btn.className='dc shake';
  setTimeout(()=>btn.className='dc used',400);
  const el=document.getElementById('ri');
  if(el){
    el.textContent=n+(n===20?' KRITISCH!':n===1?' MIES!':'');
    el.className='br'+(n===20?' crit':n===1?' fumb':'');
  }
  lockAct(3000); // keep result visible for 3 seconds
  const rn=RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;
  addLog('roll',`${rn} Initiative: ${n}`);
  toH({t:'INIT_ROLL',role:ME.role,val:n});
}

// MONSTER PICK
function rKPick(a){
  const k=ME.kaiju||KAIJU[0];
  a.innerHTML=`<div class="sl">KAIJU AKTION</div>
    <div class="ec kai" style="margin-bottom:8px"><div class="en" style="color:var(--rd)">${k.nm}</div>
    <div style="font-family:var(--fm);font-size:.54rem;color:var(--dm);margin-top:2px">Special: ${k.sp}</div></div>
    <div class="sl">FÄHIGKEITEN</div><div id="al"></div>
    <button class="btn r" style="margin-top:7px" onclick="setTP('ZIEL')">WEITER →</button>`;
  const al=document.getElementById('al');
  k.ab.forEach(ab=>{
    const b=document.createElement('button');b.className='ab';b.textContent=ab;
    b.onclick=()=>{
      document.querySelectorAll('#al .ab').forEach(x=>x.style.borderColor='');
      b.style.borderColor='var(--rd)';
      T.wep='__k_'+ab;
      addLog('phase',`★ KAIJU: ${ab}`);
    };
    al.appendChild(b);
  });
}

// WEAPON
function rWep(a){
  const e=G.ents[ME.role];const ws=e?.weps||[];
  a.innerHTML=`<div class="sl">WAFFE WÄHLEN</div><div id="wl"></div><div id="wk" style="margin-top:7px"></div>`;
  const wl=document.getElementById('wl');
  ws.forEach(wid=>{
    const w=WEPS[wid];if(!w)return;
    const d=document.createElement('div');d.className='wo'+(T.wep===wid?' sel':'');
    d.innerHTML=`<div class="wbd">${w.t}</div><div><div class="wn">${w.n}</div><div class="ws">${w.d} · ${w.r}${w.x?' · '+w.x:''}</div></div>`;
    d.onclick=()=>{T.wep=wid;renAct();};
    wl.appendChild(d);
  });
  if(T.wep&&WEPS[T.wep])document.getElementById('wk').innerHTML=`<button class="btn c" onclick="addLog('sys','Waffe: '+WEPS[T.wep].n);setTP('ZIEL')">BESTÄTIGEN →</button>`;
}

// TARGET
function rTgt(a){
  const tgts=Object.values(G.ents).filter(e=>ME.role==='monster'?!e.isK&&e.hp>0:e.isK&&e.hp>0);
  a.innerHTML=`<div class="sl">ZIEL WÄHLEN</div><div id="tl"></div>`;
  const tl=document.getElementById('tl');
  if(!tgts.length){tl.innerHTML='<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);padding:8px">Keine Ziele.</div>';return;}
  tgts.forEach(e=>{
    const pct=Math.max(0,Math.round(e.hp/e.mhp*100));const bc=pct>60?'':pct>30?' w':' cr';
    const d=document.createElement('div');d.className='ec'+(e.isK?' kai':'')+(T.tgt===e.id?' turn':'');d.style.cursor='pointer';
    d.innerHTML=`<div class="en" style="${e.isK?'color:var(--rd)':''}">→ ${e.nm}</div><div class="et">${e.tp}</div>
      <div class="hpt"><div class="hpf${bc}" style="width:${pct}%"></div></div><div class="hptx">${e.hp}/${e.mhp} · ARM ${e.ar}</div>`;
    d.onclick=()=>{T.tgt=e.id;renAct();};
    tl.appendChild(d);
  });
  if(T.tgt){const cd=document.createElement('div');cd.style.marginTop='7px';
    cd.innerHTML=`<button class="btn c" onclick="addLog('sys','Ziel: '+(G.ents[T.tgt]?.nm||'?'));setTP('ANGRIFF')">BESTÄTIGEN →</button>`;
    tl.appendChild(cd);}
}

// ATTACK
function rAtk(a){
  const w=WEPS[T.wep],t=G.ents[T.tgt],isKA=T.wep?.startsWith('__k_');
  a.innerHTML=`<div class="sl">ANGRIFFSWURF</div>
    ${w?`<div class="ec" style="margin-bottom:7px;border-color:var(--bh)"><div class="en">${w.n}</div><div class="et">${w.t} · ${w.d}${w.x?' · '+w.x:''}</div></div>`:''}
    ${isKA?`<div class="ec kai" style="margin-bottom:7px"><div class="en" style="color:var(--rd)">${T.wep.replace('__k_','')}</div></div>`:''}
    ${t?`<div style="font-family:var(--fm);font-size:.6rem;color:var(--dm);margin-bottom:9px">→ ${t.nm} (ARM ${t.ar})</div>`:''}
    <div style="display:flex;justify-content:center;margin-bottom:11px"><button class="dc" onclick="doAtk(this)">W20</button></div>
    <div class="br" id="ra"></div>`;
}
function doAtk(btn){
  const n=roll(20);T.atk=n;
  btn.className='dc shake';setTimeout(()=>btn.className='dc used',400);
  const el=document.getElementById('ra');
  el.textContent=n+(n===20?' KRITISCH!':n===1?' PATZER!':'');
  el.className='br'+(n===20?' crit':n===1?' fumb':'');
  lockAct(2500); // keep result visible
  addLog('roll',`${myName()} Angriff: ${n}${n===20?' [KRIT]':n===1?' [PATZER]':''}`);
  if(n===1){
    addLog('dmg','Patzer — kein Schaden!');
    setTimeout(()=>{_actLock=false;setTP('DONE');},2500);
  } else {
    // Show "WEITER" button after the lock expires instead of auto-advancing
    setTimeout(()=>{
      _actLock=false;
      // Add continue button below the result
      const el2=document.getElementById('ra');
      if(el2&&el2.parentElement){
        const cb=document.createElement('div');
        cb.style.marginTop='12px';
        cb.innerHTML='<button class="btn c" style="width:100%" onclick="setTP(\'SCHADEN\')">WEITER ZUM SCHADEN →</button>';
        el2.parentElement.appendChild(cb);
      }
    },2500);
  }
}

// DAMAGE
function rDmgP(a){
  const w=WEPS[T.wep],isKA=T.wep?.startsWith('__k_');
  const isCrit=T.atk===20;
  const nota=w?w.d:(isKA?'3W8':'2W6');
  a.innerHTML=`<div class="sl">SCHADEN WÜRFELN</div>
    <div style="font-family:var(--fm);font-size:.63rem;color:var(--dm);margin-bottom:10px">Würfel: <span style="color:var(--yl)">${nota}${isCrit?' × 2 (KRIT)':''}</span></div>
    <div style="display:flex;justify-content:center;margin-bottom:11px"><button class="dc" onclick="doDmgRoll(this,'${nota}')">WÜRFELN</button></div>
    <div class="br" id="rd2"></div><div id="dca" style="margin-top:9px"></div>`;
}
function doDmgRoll(btn,nota){
  let n=rollD(nota);if(T.atk===20)n*=2;T.dmg=n;
  btn.className='dc used';
  const el=document.getElementById('rd2');
  el.textContent=n+(T.atk===20?' [KRIT ×2]':'');el.className='br'+(T.atk===20?' crit':'');
  lockAct(60000); // lock until player clicks apply
  addLog('roll',`${myName()} Schaden: ${n}${T.atk===20?' [KRIT]':''}`);
  // Show apply button after short delay for dramatic effect
  setTimeout(()=>{
    const dca=document.getElementById('dca');
    if(dca)dca.innerHTML='<button class="btn r" style="width:100%;padding:12px 16px;font-size:.65rem" onclick="_actLock=false;openDM()">SCHADEN ANWENDEN (${n}) →</button>';
  },800);
}
function openDM(){
  const t=G.ents[T.tgt];
  const raw=T.dmg||0;
  const arm=t?.ar||0;
  const final=Math.max(0, raw - arm);
  document.getElementById('mdt').textContent='Ziel: '+(t?.nm||'?');
  document.getElementById('mdroll').textContent=raw;
  document.getElementById('mdarm').textContent='Rüstung: −'+arm;
  document.getElementById('mdfinal').textContent='→ '+final+' effektiver Schaden';
  document.getElementById('mdv').value=raw; // hidden field carries the raw value
  openM('md');
}
function doDmg(){
  const raw=parseInt(document.getElementById('mdv').value)||0;
  closeM('md');
  _actLock=false; // unlock action area
  const t=G.ents[T.tgt];
  const red=Math.max(0,raw-(t?.ar||0));
  addLog('dmg',`${t?.nm||'?'} −${red} HP (${raw}−${t?.ar||0}) → ${Math.max(0,(t?.hp||0)-red)}/${t?.mhp||0}`);
  if(t&&t.hp-red<=0)addLog('dmg',`⚠ ${t.nm} AUSGESCHALTET!`);
  toH({t:'DMG',tgt:T.tgt,raw});
  setTimeout(()=>setTP('DONE'),500);
}

// DONE — turn finished, advance to next player
function rDone(a){
  a.innerHTML=`<div class="sl">ZUG ABGESCHLOSSEN</div>
    <div style="font-family:var(--fm);font-size:.66rem;color:var(--gr);text-align:center;padding:10px 0;line-height:2">
      ✓ Dein Zug ist beendet.
    </div>
    <button class="btn c" style="width:100%" onclick="endMyTurn()">NÄCHSTER SPIELER →</button>`;
}
function endMyTurn(){
  T={wep:null,tgt:null,atk:null,dmg:null};
  toH({t:'NEXT_TURN'});
}

// ROUND END
function rRndEnd(a){
  const isM=ME.role==='monster';
  a.innerHTML=`<div class="sl">RUNDE ${G.round} ABGESCHLOSSEN</div>
    <div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);margin-bottom:11px;line-height:1.8">Alle Züge abgeschlossen.</div>
    ${isM?`<button class="btn g" style="width:100%" onclick="nextRound()">NÄCHSTE RUNDE →</button>`
    :`<div style="font-family:var(--fm);font-size:.58rem;color:var(--dm)">Monster-Controller startet nächste Runde.</div>`}`;
}
function nextRound(){
  addLog('phase',`══ RUNDE ${G.round+1} BEGINNT ══`);
  toH({t:'START_ROUND',round:G.round+1});
}

// ── SET TURN PHASE ────────────────────────────────────────────
function setTP(p){
  G.turnPhase=p;
  toH({t:'SET_TURN_PHASE',p});
  render();
}

// ── LOG ───────────────────────────────────────────────────────
function addLog(type,msg){
  const ts=new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const e={type,msg,ts};
  // Only send to host — host adds to G.log and broadcasts back
  // But we also need local display immediately for the sender
  if(!G.log.includes(e)) G.log.push(e); // local for immediate display
  renLog();
  toH({t:'LOG',e});
}

function renLog(){
  const l=document.getElementById('cl');if(!l)return;l.innerHTML='';
  (G.log||[]).forEach(e=>{
    const d=document.createElement('div');d.className='lr '+(e.type||'');
    d.innerHTML=`<span class="ts">${e.ts||''}</span><span class="m">${e.msg}</span>`;
    l.appendChild(d);
  });
  l.scrollTop=l.scrollHeight;
}

// ── START COMBAT (first time) ─────────────────────────────────
// The first player to go to combat sends ALL_READY
// which triggers INIT_ROLL on host.
// But we need ALL players ready first.
// Simple approach: each player goes to combat screen.
// When they click a "START KAMPF" button, it triggers the init phase.
// We show a "waiting for combat start" until state changes.

// Actually let's add a START button on combat screen if state is still LOBBY
// Only host/monster can press it.

// ── DICE ──────────────────────────────────────────────────────
function roll(n){return Math.floor(Math.random()*n)+1;}
function rollD(s){const m=s.match(/(\d+)[Wd](\d+)(?:\+(\d+))?/);if(!m)return 0;let t=0;for(let i=0;i<+m[1];i++)t+=roll(+m[2]);if(m[3])t+=+m[3];return t;}
function rnd(){return Math.random().toString(36).slice(2,10);}
function myName(){return RDEFS.find(r=>r.id===ME.role)?.nm||ME.role;}

// ── SCREEN/MODAL ──────────────────────────────────────────────
function go(id){document.querySelectorAll('.S').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on');}
function openM(id){document.getElementById(id)?.classList.add('on');}
function closeM(id){document.getElementById(id)?.classList.remove('on');}

// Patch renAct for LOBBY state — show start button
const _renAct=renAct;
// Override: if state LOBBY show start button
function renActWrap(){
  const a=document.getElementById('ca');if(!a)return;
  if(G.state==='LOBBY'){
    const entCount=Object.keys(G.ents).length;
    const canStart=entCount>=2; // at least 2 entities (1 player + monster)
    a.innerHTML=`<div class="sl">BEREIT</div>
      <div style="font-family:var(--fm);font-size:.64rem;color:var(--dm);padding:8px 0;line-height:2;text-align:center">
        ${entCount} Einheit${entCount!==1?'en':''} bereit.<br>
        ${canStart?'Starte den Kampf wenn alle bereit sind.':'Warte bis mindestens 2 Spieler bereit sind.'}
      </div>
      ${canStart?`<button class="btn g" style="width:100%" onclick="startCombat()">⚔ KAMPF STARTEN</button>`:''}`;
    return;
  }
  _renAct(); // call original
}
// Replace renAct
renAct=renActWrap;

function startCombat(){
  addLog('phase',`══ RUNDE 1 — KAMPF BEGINNT ══`);
  toH({t:'ALL_READY'});
}

// ── VIEWPORT ──────────────────────────────────────────────────
(function vh(){document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px')})();
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'));});
console.log('%cKAIJU SKIRMISH v0.4','color:#00c8f0;font-family:monospace;font-weight:bold;font-size:13px');
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ═══════════════════════════════════════════════════════════
//  3D BATTLEFIELD
//  45x45 tile grid, 1 tile = 1 unit
//  Spawn: players bottom half, kaiju top half
// ═══════════════════════════════════════════════════════════

const GRID = 45;
const TILE = 1; // 1 unit per tile
const BASE_URL = 'https://birdbrain1991.github.io/TornRealms/';

let scene, camera, renderer, controls;
let gridMesh;
let unitMeshes = {}; // roleId -> { mesh, pos:{x,z}, label }
let initialized = false;

// Expose to global scope so main script can call
window.init3D = init3D;
window.update3DPositions = update3DPositions;
window.getDistanceTiles = getDistanceTiles;

function init3D() {
  if (initialized) return;
  const container = document.getElementById('viewport3d');
  if (!container) return;

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020408);
  scene.fog = new THREE.FogExp2(0x020408, 0.012);

  // Camera — isometric-ish angle looking down at grid
  const w = container.clientWidth, h = container.clientHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 200);
  camera.position.set(22, 35, 50);
  camera.lookAt(22, 0, 22);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // Insert canvas as first child (before overlay)
  container.insertBefore(renderer.domElement, container.firstChild);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(22, 0, 22);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.45;
  controls.minDistance = 15;
  controls.maxDistance = 80;
  controls.update();

  // Lights
  const amb = new THREE.AmbientLight(0x304060, 0.6);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xaaccff, 1.2);
  dir.position.set(20, 40, 30);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  dir.shadow.camera.near = 1;
  dir.shadow.camera.far = 100;
  dir.shadow.camera.left = -30;
  dir.shadow.camera.right = 30;
  dir.shadow.camera.top = 30;
  dir.shadow.camera.bottom = -30;
  scene.add(dir);

  // Point light for atmosphere
  const pt = new THREE.PointLight(0x00c8f0, 0.4, 60);
  pt.position.set(22, 10, 22);
  scene.add(pt);

  // Grid floor
  buildGrid();

  // Resize handler
  const ro = new ResizeObserver(() => {
    const w2 = container.clientWidth, h2 = container.clientHeight;
    if (w2 === 0 || h2 === 0) return;
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
    renderer.setSize(w2, h2);
  });
  ro.observe(container);

  initialized = true;
  animate();
}

function buildGrid() {
  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(GRID, GRID);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x080c16,
    roughness: 0.9,
    metalness: 0.1,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(GRID / 2 - 0.5, -0.01, GRID / 2 - 0.5);
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines
  const gridHelper = new THREE.GridHelper(GRID, GRID, 0x102030, 0x0a1520);
  gridHelper.position.set(GRID / 2 - 0.5, 0, GRID / 2 - 0.5);
  scene.add(gridHelper);

  // Spawn zone indicators
  // Player zone: bottom (z > 30)
  const pZoneGeo = new THREE.PlaneGeometry(GRID, 14);
  const pZoneMat = new THREE.MeshBasicMaterial({ color: 0x00c8f0, transparent: true, opacity: 0.03 });
  const pZone = new THREE.Mesh(pZoneGeo, pZoneMat);
  pZone.rotation.x = -Math.PI / 2;
  pZone.position.set(GRID / 2 - 0.5, 0.01, 37);
  scene.add(pZone);

  // Kaiju zone: top (z < 14)
  const kZoneGeo = new THREE.PlaneGeometry(GRID, 14);
  const kZoneMat = new THREE.MeshBasicMaterial({ color: 0xf03040, transparent: true, opacity: 0.03 });
  const kZone = new THREE.Mesh(kZoneGeo, kZoneMat);
  kZone.rotation.x = -Math.PI / 2;
  kZone.position.set(GRID / 2 - 0.5, 0.01, 7);
  scene.add(kZone);

  // Border edges glow
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(GRID, 0.05, GRID));
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x102840 });
  const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
  edgeLine.position.set(GRID / 2 - 0.5, 0, GRID / 2 - 0.5);
  scene.add(edgeLine);
}

// Spawn positions
function getSpawnPos(roleId, index) {
  if (roleId === 'monster') {
    // Kaiju: center-top
    return { x: 22, z: 6 };
  }
  // Players: spread across bottom
  const offsets = [
    { x: 15, z: 38 },
    { x: 22, z: 40 },
    { x: 29, z: 38 },
    { x: 22, z: 36 },
  ];
  return offsets[index % offsets.length];
}

// Create or update unit meshes based on G.ents
function update3DPositions() {
  if (!initialized || !scene) return;
  
  // Access global G
  const G = window.G;
  if (!G || !G.ents) return;

  const loader = new GLTFLoader();
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://unpkg.com/three@0.162.0/examples/jsm/libs/draco/');
  loader.setDRACOLoader(dracoLoader);
  let playerIdx = 0;

  Object.values(G.ents).forEach(ent => {
    const id = ent.id;

    // Already have a mesh?
    if (unitMeshes[id]) {
      // Update position if stored in G.ents[id].pos
      if (ent.pos) {
        unitMeshes[id].mesh.position.x = ent.pos.x;
        unitMeshes[id].mesh.position.z = ent.pos.z;
      }
      // Update visibility based on HP
      unitMeshes[id].mesh.visible = ent.hp > 0;
      return;
    }

    // Determine spawn position
    const spawn = getSpawnPos(id, playerIdx);
    if (!ent.isK) playerIdx++;

    // Store position in entity for syncing
    if (!ent.pos) ent.pos = { x: spawn.x, z: spawn.z };

    if (ent.isK) {
      // KAIJU: load GLB model
      const mesh = new THREE.Group();
      mesh.position.set(spawn.x, 0, spawn.z);
      scene.add(mesh);

      // Red glow underneath
      const glowGeo = new THREE.CircleGeometry(3, 16);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0xf03040, transparent: true, opacity: 0.15 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(spawn.x, 0.02, spawn.z);
      scene.add(glow);

      // Temporary red box placeholder while loading
      const tmpGeo = new THREE.BoxGeometry(3, 4, 3);
      const tmpMat = new THREE.MeshStandardMaterial({ color: 0xf03040, emissive: 0x400000, roughness: 0.4, metalness: 0.3 });
      const tmp = new THREE.Mesh(tmpGeo, tmpMat);
      tmp.position.y = 2;
      tmp.castShadow = true;
      mesh.add(tmp);

      unitMeshes[id] = { mesh, pos: spawn, glow, tmp };

      // Load kaiju model
      const kaijuUrl = BASE_URL + 'kaiju-test.glb';
      console.log('[3D] Loading kaiju from:', kaijuUrl);

      loader.load(kaijuUrl, (gltf) => {
        console.log('[3D] Kaiju loaded successfully');
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
        });
        // No scaling — already done in Blender
        // Origin at 0,0,0 — place directly
        model.position.set(0, 0, 0);

        // Remove placeholder, add model
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          unitMeshes[id].tmp = null;
        }
        mesh.add(model);
        unitMeshes[id].model = model;
      },
      (xhr) => {
        if (xhr.total > 0) console.log('[3D] Loading kaiju: ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
      },
      (err) => {
        console.warn('[3D] Failed to load kaiju model:', err.message || err);
        console.warn('[3D] URL was:', kaijuUrl);
        // Keep the red box as fallback
      });
    } else {
      // MECHA: load GLB
      const mesh = new THREE.Group();
      mesh.position.set(spawn.x, 0, spawn.z);
      scene.add(mesh);

      // Cyan glow underneath while loading
      const glowGeo = new THREE.CircleGeometry(1.2, 16);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0x00c8f0, transparent: true, opacity: 0.2 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(spawn.x, 0.02, spawn.z);
      scene.add(glow);

      // Temporary cylinder placeholder
      const tmpGeo = new THREE.CylinderGeometry(0.4, 0.4, 2, 8);
      const tmpMat = new THREE.MeshStandardMaterial({ color: 0x00c8f0, emissive: 0x002040 });
      const tmp = new THREE.Mesh(tmpGeo, tmpMat);
      tmp.position.y = 1;
      mesh.add(tmp);

      unitMeshes[id] = { mesh, pos: spawn, glow, tmp };

      // Load actual model
      const modelUrl = BASE_URL + 'mecha-test.glb';
      console.log('[3D] Loading mecha from:', modelUrl);
      
      loader.load(modelUrl, (gltf) => {
        console.log('[3D] Mecha loaded successfully');
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        // Auto-scale: fit to ~2 units tall
        const box3 = new THREE.Box3().setFromObject(model);
        const sz = new THREE.Vector3();
        box3.getSize(sz);
        const maxDim = Math.max(sz.x, sz.y, sz.z, 0.01);
        const s = 2.5 / maxDim;
        model.scale.setScalar(s);
        
        // Re-calc bounds after scaling
        const box3b = new THREE.Box3().setFromObject(model);
        // Place model so bottom sits on ground
        model.position.y = -box3b.min.y;
        // Center X/Z
        const center = new THREE.Vector3();
        box3b.getCenter(center);
        model.position.x = -center.x;
        model.position.z = -center.z;

        // Remove temp cylinder, add model
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          unitMeshes[id].tmp = null;
        }
        model.rotation.y = Math.PI; // 180° drehen
        mesh.add(model);
        unitMeshes[id].model = model;
      }, 
      // Progress
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.round(xhr.loaded / xhr.total * 100);
          console.log('[3D] Loading mecha: ' + pct + '%');
        }
      },
      // Error — make the placeholder a visible cyan mecha-box instead of cylinder
      (err) => {
        console.warn('[3D] Failed to load mecha model:', err.message || err);
        console.warn('[3D] URL was:', modelUrl);
        console.warn('[3D] Make sure mecha-test.glb exists at that URL');
        // Replace cylinder with a visible box as fallback
        if (unitMeshes[id] && unitMeshes[id].tmp) {
          mesh.remove(unitMeshes[id].tmp);
          unitMeshes[id].tmp.geometry.dispose();
          unitMeshes[id].tmp.material.dispose();
          // Mecha-shaped box fallback
          const fbGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
          const fbMat = new THREE.MeshStandardMaterial({ 
            color: 0x00c8f0, emissive: 0x003050, roughness: 0.5, metalness: 0.6 
          });
          const fb = new THREE.Mesh(fbGeo, fbMat);
          fb.position.y = 1;
          fb.castShadow = true;
          mesh.add(fb);
          unitMeshes[id].tmp = fb;
          // Also add a "head"
          const headGeo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
          const head = new THREE.Mesh(headGeo, fbMat);
          head.position.y = 2.2;
          head.castShadow = true;
          mesh.add(head);
          // Shoulders
          const shGeo = new THREE.BoxGeometry(1.4, 0.3, 0.6);
          const sh = new THREE.Mesh(shGeo, fbMat);
          sh.position.y = 1.8;
          sh.castShadow = true;
          mesh.add(sh);
        }
      });
    }
  });

  updateDistanceOverlay();
}

// Distance measurement between all units (in tiles)
function getDistanceTiles(a, b) {
  if (!a || !b) return 0;
  const dx = a.x - b.x;
  const dz = a.z - b.z;
  return Math.round(Math.sqrt(dx * dx + dz * dz));
}

function updateDistanceOverlay() {
  const overlay = document.getElementById('dist-overlay');
  if (!overlay) return;
  overlay.innerHTML = '';

  const ids = Object.keys(unitMeshes);
  if (ids.length < 2) return;

  // Show distances from current player's unit to all others
  const ME = window.ME;
  const myId = ME?.role;
  const myUnit = unitMeshes[myId];
  if (!myUnit) return;

  ids.forEach(id => {
    if (id === myId) return;
    const other = unitMeshes[id];
    const G = window.G;
    const ent = G?.ents?.[id];
    if (!ent || ent.hp <= 0) return;

    const dist = getDistanceTiles(myUnit.pos, other.pos);
    const tag = document.createElement('span');
    tag.className = 'dist-tag';
    tag.style.color = ent.isK ? 'var(--rd)' : 'var(--cy)';
    tag.textContent = `${ent.nm}: ${dist} Tiles`;
    overlay.appendChild(tag);
  });
}

function animate() {
  requestAnimationFrame(animate);
  if (!renderer) return;

  controls?.update();

  // Hover animation on kaiju placeholder ONLY — reset group Y when model loads
  const km = unitMeshes['monster'];
  if (km?.tmp && !km.model) {
    km.tmp.position.y = 2 + Math.sin(Date.now() * 0.002) * 0.3;
    km.tmp.rotation.y += 0.003;
  } else if (km?.mesh && km.model) {
    km.mesh.position.y = 0; // ensure group is on ground once model loaded
  }

  // Gentle glow pulse on all units
  Object.values(unitMeshes).forEach(u => {
    if (u.glow) {
      u.glow.material.opacity = 0.12 + Math.sin(Date.now() * 0.003) * 0.06;
    }
  });

  renderer.render(scene, camera);
}

// Hook into the global render cycle
const _origRender = window.render;
window.render = function() {
  _origRender?.();
  // Init 3D when combat screen first appears
  if (document.getElementById('SC')?.classList.contains('on')) {
    if (!initialized) {
      setTimeout(() => { init3D(); update3DPositions(); }, 100);
    } else {
      update3DPositions();
    }
  }
};

// Also hook into goCombat
const _origGoCombat = window.goCombat;
window.goCombat = function() {
  _origGoCombat?.();
  setTimeout(() => { init3D(); update3DPositions(); }, 200);
};

</script>
